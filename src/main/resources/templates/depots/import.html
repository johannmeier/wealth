<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{csv.import.title}">CSV-Import</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:560px">

  <h3 th:text="#{csv.import.title}">CSV-Import</h3>
  <p class="text-muted">
    <span th:text="#{page.depots.title}">Depot</span>:
    <strong th:text="${depot.name}"></strong>
  </p>

  <!-- Error alert -->
  <div th:if="${importError}" class="alert alert-danger alert-dismissible fade show">
    <strong th:text="#{csv.import.error}">Fehler:</strong>
    <span th:text="${importError}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>

  <!-- Success alert -->
  <div th:if="${importResult}" class="alert alert-success alert-dismissible fade show">
    <strong th:text="#{csv.import.success}">Import erfolgreich.</strong>
    <span th:text="${importResult.positionsUpdated()}"></span>
    <span th:text="#{csv.import.positions-updated}">Positionen aktualisiert.</span>
    <span th:if="${!importResult.newAssets().isEmpty()}">
      – <span th:text="#{csv.import.new-assets}">Neue Wertpapiere:</span>
      <strong th:text="${#strings.arrayJoin(importResult.newAssets().toArray(), ', ')}"></strong>
    </span>
    <span th:if="${!importResult.skipped().isEmpty()}">
      – <span th:text="#{csv.import.skipped}">Übersprungen:</span>
      <strong th:text="${#strings.arrayJoin(importResult.skipped().toArray(), ', ')}"></strong>
    </span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>

  <div class="card">
    <div class="card-body">
      <form th:action="@{/depots/{id}/import(id=${depot.id})}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label" for="format" th:text="#{csv.import.format}">Format</label>
          <select id="format" name="format" class="form-select" required>
            <option th:if="${suggestedFormat == null}" value="" selected disabled
                    th:text="#{form.select}">-- wählen --</option>
            <option value="dkb" th:text="#{csv.import.format.dkb}"
                    th:selected="${suggestedFormat == 'dkb'}">DKB Depot-Export</option>
            <option value="fdb" th:text="#{csv.import.format.fdb}"
                    th:selected="${suggestedFormat == 'fdb'}">FondsDepotBank Depot-Export</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="file" th:text="#{csv.import.file}">CSV-Datei</label>
          <input type="file" id="file" name="file" class="form-control" accept=".csv" required/>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" th:text="#{csv.import.run}">Importieren</button>
          <a th:href="@{/depots/{id}/positions(id=${depot.id})}" class="btn btn-outline-secondary"
             th:text="#{common.back}">Zurück</a>
        </div>
      </form>
    </div>
  </div>

</div>

<!-- Geänderte Positionen (volle Breite) -->
<div th:if="${importResult != null and !importResult.changed().isEmpty()}"
     class="container-fluid px-4 mt-3 mb-4">
  <div class="card">
    <div class="card-header" th:text="#{csv.import.changed}">Geänderte Positionen</div>
    <table class="table table-sm mb-0">
      <thead class="table-light">
        <tr>
          <th th:text="#{col.name}">Name</th>
          <th th:text="#{col.isin}">ISIN</th>
          <th class="text-end" th:text="#{csv.import.old-qty}">Vorher</th>
          <th class="text-end" th:text="#{csv.import.new-qty}">Nachher</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${importResult.changed()}">
          <td th:text="${p.name()}"></td>
          <td th:text="${p.identifier()}"></td>
          <td class="text-end text-muted"
              th:text="${p.oldQuantity() != null} ? ${#numbers.formatDecimal(p.oldQuantity(), 1, 'DEFAULT', 6, 'DEFAULT')} : '–'"></td>
          <td class="text-end fw-semibold"
              th:text="${#numbers.formatDecimal(p.newQuantity(), 1, 'DEFAULT', 6, 'DEFAULT')}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
