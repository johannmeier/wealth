<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Depots</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" aria-label="Schließen" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <table class="table table-striped table-hover align-middle">
    <caption>
      <div class="d-flex justify-content-between align-items-center">
        <span>Depots</span>
        <a th:href="@{/depots/new}" class="btn btn-primary btn-sm">+ Neu</a>
      </div>
    </caption>
    <thead class="table-dark">
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Beschreibung</th>
        <th scope="col" class="text-end">Aktueller Wert</th>
        <th scope="col">Aktionen</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="d : ${depots}">
        <td th:text="${d.name}"></td>
        <td th:text="${d.description ?: '-'}"></td>
        <td class="text-end">
          <span th:with="val=${depotValues.get(d.id)}"
                th:text="${val != null and val.compareTo(T(java.math.BigDecimal).ZERO) > 0}
                          ? ${#numbers.formatDecimal(val, 1, 'COMMA', 2, 'POINT')} + ' EUR'
                          : '—'"></span>
        </td>
        <td>
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" aria-label="Aktionen">Aktionen</button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/depots/{id}/edit(id=${d.id})}">Bearbeiten</a></li>
              <li><a class="dropdown-item" th:href="@{/depots/{id}/positions(id=${d.id})}">Positionen</a></li>
              <li><hr class="dropdown-divider"/></li>
              <li>
                <form th:action="@{/depots/{id}/delete(id=${d.id})}" method="post"
                      onsubmit="return confirm('Wirklich löschen?')">
                  <button type="submit" class="dropdown-item text-danger">Löschen</button>
                </form>
              </li>
            </ul>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(depots)}">
        <td colspan="4" class="text-center text-muted">Keine Depots vorhanden.</td>
      </tr>
    </tbody>
    <tfoot th:if="${!#lists.isEmpty(depots)}">
      <tr class="table-secondary fw-bold">
        <td colspan="2">Gesamt</td>
        <td class="text-end" th:text="${#numbers.formatDecimal(depotTotal, 1, 'COMMA', 2, 'POINT')} + ' EUR'"></td>
        <td></td>
      </tr>
    </tfoot>
  </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
