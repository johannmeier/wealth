<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Depots</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Depots</h3>
    <a th:href="@{/depots/new}" class="btn btn-primary">+ Neu</a>
  </div>
  <table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
      <tr><th>Name</th><th>Beschreibung</th><th>Aktionen</th></tr>
    </thead>
    <tbody>
      <tr th:each="d : ${depots}">
        <td th:text="${d.name}"></td>
        <td th:text="${d.description ?: '-'}"></td>
        <td>
          <a th:href="@{/depots/{id}/edit(id=${d.id})}" class="btn btn-sm btn-outline-secondary">Bearbeiten</a>
          <form th:action="@{/depots/{id}/delete(id=${d.id})}" method="post" class="d-inline"
                onsubmit="return confirm('Wirklich löschen?')">
            <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(depots)}">
        <td colspan="3" class="text-center text-muted">Keine Depots vorhanden.</td>
      </tr>
    </tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
