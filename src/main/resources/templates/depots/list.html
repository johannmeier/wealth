<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.depots.title}">Depots</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <table class="table table-striped table-hover align-middle">
    <caption>
      <div class="d-flex justify-content-between align-items-center">
        <span th:text="#{page.depots.title}">Depots</span>
        <a th:href="@{/depots/new}" class="btn btn-primary btn-sm" th:text="#{common.new}">+ Neu</a>
      </div>
      <div th:if="${!#lists.isEmpty(depots)}" class="alert alert-info d-flex justify-content-between align-items-center mb-0 mt-2 fs-6 fw-normal">
        <span th:text="#{common.total}">Gesamt</span>
        <strong th:text="${#numbers.formatDecimal(depotTotal.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')} + ' ' + ${displayCurrency}"></strong>
      </div>
    </caption>
    <thead class="table-dark">
      <tr>
        <th scope="col" th:text="#{col.bank}">Bank</th>
        <th scope="col" th:text="#{col.name}">Name</th>
        <th scope="col" th:text="#{col.description}">Beschreibung</th>
        <th scope="col" class="text-end" th:text="#{col.value.eur}">Aktueller Wert</th>
        <th scope="col" th:text="#{col.last-changed}">Letzte Änderung</th>
        <th scope="col" th:text="#{common.actions}">Aktionen</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="d : ${depots}">
        <td th:text="${d.bank?.name ?: '-'}"></td>
        <td th:text="${d.name}"></td>
        <td th:text="${d.description ?: '-'}"></td>
        <td class="text-end">
          <span th:with="val=${depotValues.get(d.id)}"
                th:text="${val != null and val.compareTo(T(java.math.BigDecimal).ZERO) > 0}
                          ? ${#numbers.formatDecimal(val.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')} + ' ' + ${displayCurrency}
                          : '—'"></span>
        </td>
        <td>
          <span th:if="${depotLastChanged.containsKey(d.id)}"
                th:text="${#temporals.format(depotLastChanged.get(d.id), 'dd.MM.yyyy')}"></span>
          <span th:unless="${depotLastChanged.containsKey(d.id)}" class="text-muted">—</span>
        </td>
        <td>
          <div class="d-flex gap-1 align-items-center">
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary" type="button"
                    data-bs-toggle="dropdown" th:attr="aria-label=#{common.actions}">&#x2630;</button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/depots/{id}/edit(id=${d.id})}" th:text="#{common.edit}">Bearbeiten</a></li>
              <li><a class="dropdown-item" th:href="@{/depots/{id}/positions(id=${d.id})}" th:text="#{page.depots.positions.title}">Positionen</a></li>
              <li><a class="dropdown-item" th:href="@{/depots/{id}/import(id=${d.id})}" th:text="#{csv.import.title}">CSV-Import</a></li>
              <li><hr class="dropdown-divider"/></li>
              <li>
                <form th:action="@{/depots/{id}/delete(id=${d.id})}" method="post"
                      th:attr="onsubmit=|return confirm('#{confirm.delete}')|">
                  <button type="submit" class="dropdown-item text-danger" th:text="#{common.delete}">Löschen</button>
                </form>
              </li>
            </ul>
          </div>
          <a th:if="${importDepotIds.contains(d.id)}"
             th:href="@{/depots/{id}/import(id=${d.id})}"
             class="btn btn-sm btn-outline-secondary"
             th:attr="title=#{csv.import.title},aria-label=#{csv.import.title}">&#x2B07;</a>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(depots)}">
        <td colspan="6" class="text-center text-muted" th:text="#{page.depots.empty}">Keine Depots vorhanden.</td>
      </tr>
    </tbody>
  </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
