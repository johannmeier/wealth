<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Depots</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Depots</h3>
    <a th:href="@{/depots/new}" class="btn btn-primary">+ Neu</a>
  </div>
  <table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
      <tr><th>Name</th><th>Beschreibung</th><th class="text-end">Aktueller Wert</th><th>Aktionen</th></tr>
    </thead>
    <tbody>
      <tr th:each="d : ${depots}">
        <td th:text="${d.name}"></td>
        <td th:text="${d.description ?: '-'}"></td>
        <td class="text-end">
          <span th:with="val=${depotValues.get(d.id)}"
                th:text="${val != null and val.compareTo(T(java.math.BigDecimal).ZERO) > 0}
                          ? ${#numbers.formatDecimal(val, 1, 'COMMA', 2, 'POINT')} + ' EUR'
                          : '—'"></span>
        </td>
        <td>
          <a th:href="@{/depots/{id}/edit(id=${d.id})}" class="btn btn-sm btn-outline-secondary">Bearbeiten</a>
          <a th:href="@{/depots/{id}/positions(id=${d.id})}" class="btn btn-sm btn-outline-info">Positionen</a>
          <form th:action="@{/depots/{id}/delete(id=${d.id})}" method="post" class="d-inline"
                onsubmit="return confirm('Wirklich löschen?')">
            <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(depots)}">
        <td colspan="4" class="text-center text-muted">Keine Depots vorhanden.</td>
      </tr>
    </tbody>
    <tfoot th:if="${!#lists.isEmpty(depots)}">
      <tr class="table-secondary fw-bold">
        <td colspan="2">Gesamt</td>
        <td class="text-end" th:text="${#numbers.formatDecimal(depotTotal, 1, 'COMMA', 2, 'POINT')} + ' EUR'"></td>
        <td></td>
      </tr>
    </tfoot>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
