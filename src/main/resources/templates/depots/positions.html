<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Positionen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <h3>Positionen: <span th:text="${depot.name}"></span></h3>

  <div class="card mb-4" style="max-width:500px">
    <div class="card-header">Neuer Bestand</div>
    <div class="card-body">
      <form th:action="@{/depots/{id}/positions/save(id=${depot.id})}" method="post">
        <div class="mb-3">
          <label class="form-label">Wertpapier</label>
          <select name="assetId" class="form-select" required>
            <option value="">-- wählen --</option>
            <option th:each="a : ${assets}" th:value="${a.id}" th:text="${a.name}"></option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Datum</label>
          <input type="date" name="date" class="form-control" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Anzahl</label>
          <input type="number" name="quantity" class="form-control" step="0.0001" required/>
        </div>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </form>
    </div>
  </div>

  <h5>Historie</h5>
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead class="table-dark">
        <tr><th>Datum</th><th>Wertpapier</th><th class="text-end">Anzahl</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="q : ${quantities}">
          <td th:text="${#temporals.format(q.date, 'dd.MM.yyyy')}"></td>
          <td th:text="${q.asset.name}"></td>
          <td class="text-end" th:text="${#numbers.formatDecimal(q.quantity, 1, 'COMMA', 4, 'POINT')}"></td>
          <td>
            <form th:action="@{/depots/{id}/positions/{qid}/delete(id=${depot.id},qid=${q.id})}" method="post" class="d-inline"
                  onsubmit="return confirm('Bestand wirklich löschen?')">
              <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(quantities)}">
          <td colspan="4" class="text-center text-muted">Noch keine Bestände eingetragen.</td>
        </tr>
      </tbody>
    </table>
  </div>
  <a th:href="@{/depots}" class="btn btn-outline-secondary">Zurück</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
