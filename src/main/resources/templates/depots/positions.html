<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Positionen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" aria-label="Schließen" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <h3>Positionen: <span th:text="${depot.name}"></span></h3>

  <div class="card mb-4" style="max-width:500px">
    <div class="card-header" id="formHeader">Neuer Bestand</div>
    <div class="card-body">
      <form th:action="@{/depots/{id}/positions/save(id=${depot.id})}" method="post">
        <input type="hidden" name="quantityId" id="quantityId" value=""/>
        <div class="mb-3">
          <label class="form-label" for="assetId">Wertpapier</label>
          <select name="assetId" id="assetId" class="form-select" required>
            <option value="">-- wählen --</option>
            <option th:each="a : ${assets}" th:value="${a.id}"
                    th:text="${a.name + (a.symbol != null ? ' (' + a.symbol + ')' : '')}"></option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="date">Datum</label>
          <input type="date" name="date" id="date" class="form-control"
                 th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"/>
        </div>
        <div class="mb-3">
          <label class="form-label" for="quantity">Anzahl</label>
          <input type="number" name="quantity" id="quantity" class="form-control" step="any" required/>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Speichern</button>
          <button type="button" class="btn btn-outline-secondary" id="cancelBtn"
                  style="display:none" onclick="cancelEdit()">Abbrechen</button>
        </div>
      </form>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <caption>Positionen</caption>
      <thead class="table-dark">
        <tr>
          <th scope="col">Datum</th>
          <th scope="col">Bezeichnung</th>
          <th scope="col" class="text-end">Menge</th>
          <th scope="col" class="text-end">Wert (€)</th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="q : ${quantities}">
          <td th:text="${#temporals.format(q.date, 'dd.MM.yyyy')}"></td>
          <td><a th:href="@{/assets/{id}/edit(id=${q.asset.id})}" th:text="${q.asset.name}"></a></td>
          <td class="text-end" th:text="${q.quantity.stripTrailingZeros().toPlainString().replace('.', ',')}"></td>
          <td class="text-end">
            <span th:if="${positionValues.containsKey(q.id)}"
                  th:text="${#numbers.formatDecimal(positionValues.get(q.id), 1, 'POINT', 2, 'COMMA')}"></span>
            <span th:unless="${positionValues.containsKey(q.id)}" class="text-muted">-</span>
          </td>
          <td class="text-nowrap">
            <button type="button" class="btn btn-sm btn-outline-secondary"
                    th:attr="data-qid=${q.id},
                             data-assetid=${q.asset.id},
                             data-date=${q.date},
                             data-quantity=${q.quantity.toPlainString()}"
                    onclick="startEdit(this)">Bearbeiten</button>
            <form th:action="@{/depots/{id}/positions/{qid}/delete(id=${depot.id},qid=${q.id})}" method="post" class="d-inline"
                  onsubmit="return confirm('Bestand wirklich löschen?')">
              <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
            </form>
          </td>
        </tr>
        <tr th:each="entry : ${coinOzByMetal}">
          <td class="text-muted">-</td>
          <td>
            <a th:href="@{/coins}">
              <span th:text="${entry.key.label}"></span>
            </a>
          </td>
          <td class="text-end"
              th:text="${#numbers.formatDecimal(entry.value, 1, 'POINT', 4, 'COMMA') + ' oz'}"></td>
          <td class="text-end">
            <span th:if="${coinValueByMetal.containsKey(entry.key)}"
                  th:text="${#numbers.formatDecimal(coinValueByMetal.get(entry.key), 1, 'POINT', 2, 'COMMA')}"></span>
            <span th:unless="${coinValueByMetal.containsKey(entry.key)}" class="text-muted">-</span>
          </td>
          <td></td>
        </tr>
        <tr th:if="${#lists.isEmpty(quantities) and #maps.isEmpty(coinOzByMetal)}">
          <td colspan="5" class="text-center text-muted">Noch keine Positionen eingetragen.</td>
        </tr>
        <tr class="table-dark fw-bold">
          <td colspan="3">Gesamt</td>
          <td class="text-end"
              th:text="${#numbers.formatDecimal(positionTotal.add(coinTotal), 1, 'POINT', 2, 'COMMA')}"></td>
          <td></td>
        </tr>
      </tbody>
    </table>
  </div>

  <a th:href="@{/depots}" class="btn btn-outline-secondary mt-2">Zurück</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  const todayIso = /*[[${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}]]*/ '';

  function startEdit(btn) {
    document.getElementById('quantityId').value = btn.dataset.qid;
    document.getElementById('date').value       = btn.dataset.date;
    document.getElementById('quantity').value   = btn.dataset.quantity;
    const sel = document.getElementById('assetId');
    for (const opt of sel.options) opt.selected = (opt.value === btn.dataset.assetid);
    document.getElementById('formHeader').textContent = 'Bestand bearbeiten';
    document.getElementById('cancelBtn').style.display = 'inline-block';
    document.querySelector('.card').scrollIntoView({behavior: 'smooth'});
  }

  function cancelEdit() {
    document.getElementById('quantityId').value = '';
    document.getElementById('date').value       = todayIso;
    document.getElementById('quantity').value   = '';
    document.getElementById('assetId').value    = '';
    document.getElementById('formHeader').textContent = 'Neuer Bestand';
    document.getElementById('cancelBtn').style.display = 'none';
  }
</script>
</body>
</html>
