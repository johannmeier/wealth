<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${depot.id == null} ? #{form.new-depot} : #{form.edit-depot}">Depot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:500px">
  <h3 th:text="${depot.id == null} ? #{form.new-depot} : #{form.edit-depot}">Depot</h3>
  <form th:action="@{/depots/save}" th:object="${depot}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <div class="mb-3">
      <label class="form-label" th:text="#{col.name} + ' *'">Name *</label>
      <input type="text" th:field="*{name}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label" th:text="#{col.description}">Beschreibung</label>
      <input type="text" th:field="*{description}" class="form-control"/>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" th:text="#{common.save}">Speichern</button>
      <a th:href="@{/depots}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Abbrechen</a>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
