<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.index.title}">Vermögensübersicht</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>

  <div class="table-section">
  <div class="card bg-success text-white mb-4">
    <div class="card-body d-flex justify-content-between align-items-center">
      <h5 class="card-title mb-0" th:text="#{page.index.total-wealth}">Gesamtvermögen</h5>
      <h2 class="card-text mb-0" th:text="${#numbers.formatDecimal(totalWealth.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')} + ' ' + ${displayCurrency}">0,00 €</h2>
    </div>
  </div>

  <table class="table table-striped table-hover align-middle">
    <caption th:text="#{page.index.positions}">Positionen</caption>
    <thead class="table-dark">
      <tr>
        <th scope="col" th:text="#{col.name}">Name</th>
        <th scope="col" th:text="#{col.depot}">Depot</th>
        <th scope="col" th:text="#{col.type}">Art</th>
        <th scope="col" th:text="#{col.allocation}">Allocation</th>
        <th scope="col" th:text="#{col.index}">Index</th>
        <th scope="col" class="text-end" th:text="#{col.quantity}">Anzahl</th>
        <th scope="col" class="text-end" th:text="#{col.price.eur}">Kurs (€)</th>
        <th scope="col" class="text-end" th:text="#{col.value}">Wert (€)</th>
        <th scope="col" class="text-end" style="white-space:nowrap" th:text="#{col.percentage}">Anteil %</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="pos : ${positions}">
        <td th:text="${pos.name}"></td>
        <td>
          <th:block th:if="${depotsByAsset.get(pos.id) != null and !depotsByAsset.get(pos.id).isEmpty()}">
            <span th:each="entry, i : ${depotsByAsset.get(pos.id)}">
              <a th:href="@{/depots/{id}/positions(id=${entry.key})}" th:text="${entry.value}"></a><span th:unless="${i.last}">, </span>
            </span>
          </th:block>
          <span th:unless="${depotsByAsset.get(pos.id) != null and !depotsByAsset.get(pos.id).isEmpty()}"
                th:text="${pos.depotName ?: '-'}"></span>
        </td>
        <td>
          <span th:if="${pos.type == 'ACCOUNT'}" class="badge bg-info" th:text="#{assetType.KONTO}">Konto</span>
          <span th:if="${pos.assetType != null}" class="badge bg-primary" th:text="${#messages.msg('assetType.' + pos.assetType.name())}"></span>
        </td>
        <td>
          <span th:if="${pos.assetAllocation != null}"
                th:class="${pos.assetAllocation.name() == 'RISIKOBEHAFTET'} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                th:text="${#messages.msg('assetAllocation.' + pos.assetAllocation.name())}"></span>
        </td>
        <td style="white-space:nowrap" th:text="${pos.indexName ?: '-'}"></td>
        <td class="text-end" th:text="${pos.quantity != null ? #numbers.formatDecimal(pos.quantity, 1, 'DEFAULT', 4, 'DEFAULT') : '-'}"></td>
        <td class="text-end" style="white-space:nowrap" th:text="${pos.price != null ? #numbers.formatDecimal(pos.price.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT') + ' ' + displayCurrency : '-'}"></td>
        <td class="text-end fw-bold" th:text="${pos.value != null ? #numbers.formatDecimal(pos.value.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT') : '-'}"></td>
        <td class="text-end" style="white-space:nowrap" th:text="${pos.percentage != null ? #numbers.formatDecimal(pos.percentage, 1, 'DEFAULT', 2, 'DEFAULT') + ' %' : '-'}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(positions)}">
        <td colspan="9" class="text-center text-muted" th:text="#{page.index.empty}">Noch keine Positionen.</td>
      </tr>
    </tbody>
  </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
