<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.databases.title}">Datenbanken</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4" style="max-width: 700px">
  <h3 th:text="#{page.databases.title}">Datenbanken</h3>

  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>

  <div class="card mb-4">
    <div class="card-header" th:text="#{page.databases.available}">Verfügbare Datenbanken</div>
    <div class="card-body p-0">
      <table class="table table-striped align-middle mb-0">
        <tbody>
          <tr th:each="db : ${databases}">
            <td>
              <span th:text="${db}"></span>
              <span th:if="${db == currentDb}" class="badge bg-success ms-2" th:text="#{page.databases.active}">aktiv</span>
            </td>
            <td class="text-end">
              <form th:if="${db != currentDb}"
                    th:action="@{/settings/databases/switch}" method="post"
                    th:attr="onsubmit=|return confirm('#{page.databases.confirm-switch}')|">
                <input type="hidden" name="dbName" th:value="${db}"/>
                <button type="submit" class="btn btn-sm btn-outline-primary" th:text="#{page.databases.switch}">Wechseln</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(databases)}">
            <td colspan="2" class="text-muted text-center" th:text="#{page.databases.empty}">Keine Datenbanken gefunden.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-header" th:text="#{page.databases.create}">Neue Datenbank anlegen</div>
    <div class="card-body">
      <form th:action="@{/settings/databases/create}" method="post">
        <div class="mb-3">
          <label class="form-label" for="dbname" th:text="#{page.databases.name-label}">Name</label>
          <input type="text" id="dbname" name="name" class="form-control"
                 th:placeholder="#{page.databases.name-placeholder}" required/>
          <div class="form-text" th:text="#{page.databases.name-hint}">Nur Buchstaben und Zahlen, z.B. „familie" oder „firma".</div>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{page.databases.create-btn}">Anlegen und wechseln</button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header" th:text="#{page.databases.custom-path}">Benutzerdefinierter Pfad</div>
    <div class="card-body">
      <p class="form-text mb-3" th:text="#{page.databases.custom-path-hint}">
        Absoluter Pfad zur H2-Datenbankdatei (ohne .mv.db).
      </p>
      <div th:if="${currentDbFile != null}" class="mb-3">
        <label class="form-label small text-muted" th:text="#{page.databases.current-file}">Aktuelle Datei:</label>
        <div class="font-monospace small text-break" th:text="${currentDbFile}"></div>
      </div>
      <form th:action="@{/settings/databases/set-path}" method="post">
        <div class="mb-3">
          <label class="form-label" for="dbPath" th:text="#{page.databases.path-label}">Pfad</label>
          <input type="text" id="dbPath" name="dbPath" class="form-control font-monospace"
                 th:value="${customDbPath}"
                 th:placeholder="#{page.databases.path-placeholder}"/>
          <div class="form-text" th:text="#{page.databases.path-hint}">Leer lassen, um zur standardmäßigen Datenbankauswahl zurückzukehren.</div>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{page.databases.path-btn}">Speichern und neu starten</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
