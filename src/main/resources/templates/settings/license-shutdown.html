<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.databases.shutdown.title}">Anwendung wird beendet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-5" style="max-width: 500px">
  <div class="card text-center">
    <div class="card-body py-5">
      <h4 class="card-title mb-3" th:text="#{page.databases.shutdown.title}">Anwendung wird beendet</h4>
      <p class="card-text" th:text="#{page.license.shutdown.message}">
        Lizenz gespeichert. Die Anwendung wird beendet. Bitte starten Sie sie neu, um mit der neuen Lizenz zu arbeiten.
      </p>
      <div class="spinner-border text-secondary mt-3" role="status" id="spinner">
        <span class="visually-hidden">Warte auf Neustart...</span>
      </div>
      <p class="text-muted mt-3 small" id="statusMsg" th:text="#{page.databases.shutdown.waiting}">
        Warte auf Neustart...
      </p>
    </div>
  </div>
</div>
<script>
  function checkServer() {
    fetch('/', { method: 'HEAD', cache: 'no-store' })
      .then(function(r) {
        if (r.ok) window.location.href = '/settings/license';
      })
      .catch(function() {});
  }
  setInterval(checkServer, 10000);
</script>
</body>
</html>
