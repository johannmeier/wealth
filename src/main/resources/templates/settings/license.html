<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.license.title}">Lizenz</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4" style="max-width: 700px">
  <h3 th:text="#{page.license.title}">Lizenz</h3>

  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>

  <div class="card mb-4">
    <div class="card-header" th:text="#{page.license.status}">Status</div>
    <div class="card-body">
      <p th:if="${valid}">
        <span class="badge bg-success me-2" th:text="#{page.license.active}">Aktiv</span>
        <span th:if="${expiresOn != null}" th:text="#{page.license.expires-on} + ' ' + ${#temporals.format(expiresOn, 'dd.MM.yyyy')}"></span>
      </p>
      <p th:if="${!valid and expired}">
        <span class="badge bg-warning text-dark me-2" th:text="#{page.license.expired}">Abgelaufen</span>
      </p>
      <p th:if="${!valid and !expired}">
        <span class="badge bg-secondary me-2" th:text="#{page.license.none}">Community</span>
      </p>
      <ul th:if="${!#lists.isEmpty(features)}" class="mb-0">
        <li th:each="f : ${features}" th:text="${#messages.msgOrNull('license.feature.' + f) ?: f}"></li>
      </ul>
      <p class="text-muted mb-0" th:if="${#lists.isEmpty(features)}" th:text="#{page.license.no-features}">
        Keine kostenpflichtigen Funktionen freigeschaltet.
      </p>
    </div>
  </div>

  <div class="card">
    <div class="card-header" th:text="#{page.license.update}">Lizenzschlüssel</div>
    <div class="card-body">
      <form th:action="@{/settings/license/save}" method="post">
        <div class="mb-3">
          <label class="form-label" for="licenseKey" th:text="#{page.license.key-label}">Schlüssel</label>
          <textarea id="licenseKey" name="licenseKey" class="form-control font-monospace" rows="3"
                    th:placeholder="#{page.license.key-placeholder}"></textarea>
          <div class="form-text" th:text="#{page.license.key-hint}">Leer lassen und speichern, um die Lizenz zu entfernen.</div>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{page.license.save-btn}">Speichern und neu starten</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
