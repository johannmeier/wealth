<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.coins.quantities.title}">Mengenhistorie</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <div class="row g-4 align-items-start">
    <div class="col-lg-4">
      <h3 th:text="${coin.name}"></h3>
      <div class="card">
        <div class="card-header" th:text="#{page.coins.quantities.new}">Neuer Eintrag</div>
        <div class="card-body">
          <form th:action="@{/coins/{id}/quantities/save(id=${coin.id})}" method="post">
            <div class="mb-3">
              <label class="form-label" for="qty-date" th:text="#{col.date}">Datum</label>
              <input type="date" id="qty-date" name="date" class="form-control" required
                     th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"/>
            </div>
            <div class="mb-3">
              <label class="form-label" for="qty-quantity" th:text="#{col.quantity}">Anzahl</label>
              <input type="number" id="qty-quantity" name="quantity" class="form-control"
                     step="1" min="0" required/>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Speichern</button>
          </form>
        </div>
      </div>
      <a th:href="@{/coins}" class="btn btn-outline-secondary mt-3" th:text="#{common.back}">Zurück</a>
    </div>
    <div class="col-lg-8">
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <caption th:text="#{page.coins.quantities.history}">Mengenhistorie</caption>
          <thead class="table-dark">
            <tr>
              <th scope="col" th:text="#{col.date}">Datum</th>
              <th scope="col" class="text-end" th:text="#{col.quantity}">Anzahl</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="q : ${quantities}">
              <td th:text="${#temporals.format(q.date, 'dd.MM.yyyy')}"></td>
              <td class="text-end" th:text="${q.quantity}"></td>
              <td>
                <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                        data-bs-target="#coin-quantity-delete-modal"
                        th:attr="onclick=|document.getElementById('coin-quantity-delete-form').action='@{/coins/{id}/quantities/{qid}/delete(id=${coin.id},qid=${q.id})}';|"
                        th:text="#{common.delete}">Löschen</button>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(quantities)}">
              <td colspan="3" class="text-center text-muted" th:text="#{page.coins.quantities.empty}">Noch keine Einträge.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  </div>

  <div class="modal fade" id="coin-quantity-delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{common.delete}">Löschen</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" th:attr="aria-label=#{common.close}"></button>
        </div>
        <div class="modal-body" th:text="#{confirm.delete-coin-quantity}">Mengeneintrag wirklich löschen?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{common.cancel}">Abbrechen</button>
          <form id="coin-quantity-delete-form" method="post">
            <button type="submit" class="btn btn-danger" th:text="#{common.delete}">Löschen</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
