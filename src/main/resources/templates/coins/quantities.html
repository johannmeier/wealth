<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.coins.quantities.title}">Mengenhistorie</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <h3><span th:text="#{page.coins.quantities.title}">Mengenhistorie</span>: <span th:text="${coin.name}"></span></h3>

  <div class="card mb-4" style="max-width:400px">
    <div class="card-header" th:text="#{page.coins.quantities.new}">Neuer Eintrag</div>
    <div class="card-body">
      <form th:action="@{/coins/{id}/quantities/save(id=${coin.id})}" method="post">
        <div class="mb-3">
          <label class="form-label" for="qty-date" th:text="#{col.date}">Datum</label>
          <input type="date" id="qty-date" name="date" class="form-control" required
                 th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"/>
        </div>
        <div class="mb-3">
          <label class="form-label" for="qty-quantity" th:text="#{col.quantity}">Anzahl</label>
          <input type="number" id="qty-quantity" name="quantity" class="form-control"
                 step="1" min="0" required/>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{common.save}">Speichern</button>
      </form>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <caption th:text="#{page.coins.quantities.history}">Mengenhistorie</caption>
      <thead class="table-dark">
        <tr>
          <th scope="col" th:text="#{col.date}">Datum</th>
          <th scope="col" class="text-end" th:text="#{col.quantity}">Anzahl</th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="q : ${quantities}">
          <td th:text="${#temporals.format(q.date, 'dd.MM.yyyy')}"></td>
          <td class="text-end" th:text="${q.quantity}"></td>
          <td>
            <form th:action="@{/coins/{id}/quantities/{qid}/delete(id=${coin.id},qid=${q.id})}" method="post"
                  th:attr="onsubmit=|return confirm('#{confirm.delete-coin-quantity}')|">
              <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">Löschen</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(quantities)}">
          <td colspan="3" class="text-center text-muted" th:text="#{page.coins.quantities.empty}">Noch keine Einträge.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <a th:href="@{/coins}" class="btn btn-outline-secondary mt-2" th:text="#{common.back}">Zurück</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
