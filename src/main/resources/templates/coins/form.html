<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Münze</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:600px">
  <h3 th:text="${coin.id == null} ? 'Neue Münze' : 'Münze bearbeiten'"></h3>

  <form th:action="@{/coins/save}" th:object="${coin}" method="post" class="mt-4">
    <input type="hidden" th:field="*{id}"/>

    <div class="mb-3">
      <label class="form-label">Name *</label>
      <input type="text" th:field="*{name}" class="form-control" required
             list="coinNames" autocomplete="off"
             placeholder="z.B. Krügerrand, Maple Leaf, Wiener Philharmoniker"/>
      <datalist id="coinNames">
        <option th:each="n : ${existingNames}" th:value="${n}"></option>
      </datalist>
    </div>

    <div class="row">
      <div class="col mb-3">
        <label class="form-label">Metall *</label>
        <select th:field="*{metal}" class="form-select" required>
          <option value="">-- wählen --</option>
          <option th:each="m : ${metals}" th:value="${m}" th:text="${m.label}"></option>
        </select>
      </div>
      <div class="col mb-3">
        <label class="form-label">Prägejahr</label>
        <input type="number" th:field="*{mintYear}" class="form-control"
               placeholder="z.B. 2024" min="1800" max="2100"/>
      </div>
    </div>

    <!-- Gewichtseingabe mit Einheitswahl -->
    <div class="mb-3">
      <label class="form-label">Gewicht pro Münze *</label>
      <div class="input-group">
        <input type="number" id="weightInput" class="form-control" step="any" required
               placeholder="z.B. 31,1035"/>
        <input type="hidden" th:field="*{weightGrams}" id="weightGrams"/>
        <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                id="unitDropdown" data-bs-toggle="dropdown">g</button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item unit-option" href="#" data-unit="g">Gramm (g)</a></li>
          <li><a class="dropdown-item unit-option" href="#" data-unit="oz">Unzen (oz)</a></li>
        </ul>
      </div>
      <small class="text-muted">1 oz = 31,1035 g</small>
    </div>

    <div class="mb-3">
      <label class="form-label">Anzahl *</label>
      <input type="number" th:field="*{quantity}" class="form-control" step="1" min="1" required
             placeholder="z.B. 3"/>
    </div>

    <div class="mb-4">
      <label class="form-label">Depot *</label>
      <select name="depotId" class="form-select" required>
        <option value="">-- wählen --</option>
        <option th:each="d : ${depots}"
                th:value="${d.id}"
                th:text="${d.name}"
                th:selected="${coin.depot != null and coin.depot.id == d.id}"></option>
      </select>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Speichern</button>
      <a th:href="@{/coins}" class="btn btn-outline-secondary">Abbrechen</a>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
  const OZ_TO_G = 31.1035;
  let currentUnit = 'g';

  const weightInput  = document.getElementById('weightInput');
  const weightGrams  = document.getElementById('weightGrams');
  const unitDropdown = document.getElementById('unitDropdown');

  // Beim Laden: gespeicherten Gramm-Wert in aktive Einheit umrechnen
  const savedGrams = weightGrams.value;
  if (savedGrams) {
    weightInput.value = savedGrams;
  }

  document.querySelectorAll('.unit-option').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      const newUnit = this.dataset.unit;
      if (newUnit === currentUnit) return;

      const val = parseFloat(weightInput.value);
      if (!isNaN(val)) {
        if (currentUnit === 'g' && newUnit === 'oz') {
          weightInput.value = (val / OZ_TO_G).toFixed(6);
        } else if (currentUnit === 'oz' && newUnit === 'g') {
          weightInput.value = (val * OZ_TO_G).toFixed(6);
        }
      }

      currentUnit = newUnit;
      unitDropdown.firstChild.nodeValue = newUnit;
    });
  });

  // Beim Absenden: immer in Gramm konvertieren
  weightInput.closest('form').addEventListener('submit', function () {
    const val = parseFloat(weightInput.value);
    if (!isNaN(val)) {
      weightGrams.value = currentUnit === 'oz' ? (val * OZ_TO_G).toFixed(10) : val;
    }
  });
})();
</script>
</body>
</html>
