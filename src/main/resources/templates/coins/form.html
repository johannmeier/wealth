<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${coin.id == null} ? #{form.new-coin} : #{form.edit-coin}">Münze</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:600px">
  <h3 th:text="${coin.id == null} ? #{form.new-coin} : #{form.edit-coin}">Münze</h3>

  <form th:action="@{/coins/save}" th:object="${coin}" method="post" class="mt-4">
    <input type="hidden" th:field="*{id}"/>

    <div class="mb-3">
      <label class="form-label" th:text="#{col.name} + ' *'">Name *</label>
      <input type="text" th:field="*{name}" class="form-control" required
             list="coinNames" autocomplete="off"
             th:placeholder="#{coin.placeholder.name}"/>
      <datalist id="coinNames">
        <option th:each="n : ${existingNames}" th:value="${n}"></option>
      </datalist>
    </div>

    <div class="row">
      <div class="col mb-3">
        <label class="form-label" th:text="#{col.metal} + ' *'">Metall *</label>
        <select th:field="*{metal}" class="form-select" required>
          <option value="" th:text="#{form.select}">-- wählen --</option>
          <option th:each="m : ${metals}" th:value="${m}"
                  th:text="${#messages.msg('coinMetal.' + m.name())}"></option>
        </select>
      </div>
      <div class="col mb-3">
        <label class="form-label" th:text="#{col.mint-year}">Prägejahr</label>
        <input type="number" th:field="*{mintYear}" class="form-control"
               th:placeholder="#{coin.placeholder.year}" min="1800" max="2100"/>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" th:text="#{form.weight-per-coin}">Gewicht pro Münze *</label>
      <div class="input-group">
        <input type="number" id="weightInput" class="form-control" step="any" required
               th:placeholder="#{coin.placeholder.weight}"/>
        <input type="hidden" th:field="*{weightGrams}" id="weightGrams"/>
        <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                id="unitDropdown" data-bs-toggle="dropdown">g</button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item unit-option" href="#" data-unit="g">Gramm (g)</a></li>
          <li><a class="dropdown-item unit-option" href="#" data-unit="oz">Unzen (oz)</a></li>
        </ul>
      </div>
      <small class="text-muted">1 oz = 31,1035 g</small>
    </div>

    <div class="mb-3">
      <label class="form-label" th:text="#{col.quantity} + ' *'">Anzahl *</label>
      <input type="number" th:field="*{quantity}" class="form-control" step="1" min="1" required
             th:placeholder="#{coin.placeholder.quantity}"/>
    </div>

    <div class="mb-3">
      <label class="form-label" th:text="#{form.price-source-label} + ' *'">Wertpapier (Preisquelle) *</label>
      <select name="assetId" class="form-select" required>
        <option value="" th:text="#{form.select}">-- wählen --</option>
        <option th:each="a : ${assets}"
                th:value="${a.id}"
                th:text="${a.name + (a.symbol != null ? ' (' + a.symbol + ')' : '')}"
                th:selected="${coin.asset != null and coin.asset.id == a.id}"></option>
      </select>
      <small class="text-muted" th:text="#{form.price-source-hint}">Wenn gesetzt, wird der Kurs dieses Wertpapiers als EUR/oz verwendet.</small>
    </div>

    <div class="mb-4">
      <label class="form-label" th:text="#{col.depot} + ' *'">Depot *</label>
      <select name="depotId" class="form-select" required>
        <option value="" th:text="#{form.select}">-- wählen --</option>
        <option th:each="d : ${depots}"
                th:value="${d.id}"
                th:text="${d.name}"
                th:selected="${coin.depot != null and coin.depot.id == d.id}"></option>
      </select>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" th:text="#{common.save}">Speichern</button>
      <a th:href="@{/coins}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Abbrechen</a>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
var metalToAssetId = /*[[${metalToAssetId}]]*/ {};
/*]]>*/
</script>
<script>
(function () {
  const OZ_TO_G = 31.1034768;
  let currentUnit = 'g';

  const weightInput  = document.getElementById('weightInput');
  const weightGrams  = document.getElementById('weightGrams');
  const unitDropdown = document.getElementById('unitDropdown');

  const savedGrams = weightGrams.value;
  if (savedGrams) {
    weightInput.value = savedGrams;
  }

  document.querySelectorAll('.unit-option').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      const newUnit = this.dataset.unit;
      if (newUnit === currentUnit) return;
      const val = parseFloat(weightInput.value);
      if (!isNaN(val)) {
        if (currentUnit === 'g' && newUnit === 'oz') {
          weightInput.value = (val / OZ_TO_G).toFixed(6);
        } else if (currentUnit === 'oz' && newUnit === 'g') {
          weightInput.value = (val * OZ_TO_G).toFixed(6);
        }
      }
      currentUnit = newUnit;
      unitDropdown.firstChild.nodeValue = newUnit;
    });
  });

  weightInput.closest('form').addEventListener('submit', function () {
    const val = parseFloat(weightInput.value);
    if (!isNaN(val)) {
      weightGrams.value = currentUnit === 'oz' ? (val * OZ_TO_G).toFixed(10) : val;
    }
  });

  const metalSel = document.getElementById('metal');
  const assetSel = document.querySelector('select[name="assetId"]');
  metalSel.addEventListener('change', function () {
    var assetId = metalToAssetId[this.value];
    if (assetId != null) assetSel.value = assetId;
  });

  const nameInput = document.querySelector('input[list="coinNames"]');
  const existingNames = new Set([...document.querySelectorAll('#coinNames option')].map(o => o.value));

  nameInput.addEventListener('change', function () {
    const name = this.value.trim();
    if (!existingNames.has(name)) return;
    fetch('/coins/api/by-name?name=' + encodeURIComponent(name))
      .then(r => r.json())
      .then(data => {
        if (data.metal) document.getElementById('metal').value = data.metal;
        if (data.weightGrams != null) {
          const grams = parseFloat(data.weightGrams);
          weightGrams.value = grams;
          weightInput.value = currentUnit === 'oz' ? (grams / OZ_TO_G).toFixed(6) : grams;
        }
        const assetSel = document.querySelector('select[name="assetId"]');
        if (assetSel) assetSel.value = data.assetId != null ? data.assetId : '';
      });
  });
})();
</script>
</body>
</html>
