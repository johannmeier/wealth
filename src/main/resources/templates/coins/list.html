<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.coins.title}">Münzen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>

  <div class="table-section">

  <!-- Spot-Preise und Mengenübersicht -->
  <div class="mb-3 d-flex flex-wrap gap-3 align-items-center">
    <span th:each="entry : ${spotPrices}"
          class="badge fs-6 fw-normal px-3 py-2"
          th:style="${entry.key.name() == 'GOLD'} ? 'background-color:#b8860b' : (${entry.key.name() == 'SILBER'} ? 'background-color:#708090' : 'background-color:#5a5a72')">
      <span th:text="${#messages.msg('coinMetal.' + entry.key.name())}"></span>:
      <span th:text="${#numbers.formatDecimal(entry.value, 1, 'DEFAULT', 2, 'DEFAULT')}"></span> USD/oz
    </span>
    <span th:if="${#maps.isEmpty(spotPrices)}" class="text-muted small" th:text="#{page.coins.spot-unavailable}">Spotpreise nicht verfügbar</span>
    <span th:each="entry : ${totalQtyByMetal}" class="badge fs-6 fw-normal px-3 py-2"
          th:style="${entry.key.name() == 'GOLD'} ? 'background-color:#b8860b' : (${entry.key.name() == 'SILBER'} ? 'background-color:#708090' : 'background-color:#5a5a72')">
      <span th:text="${#messages.msg('coinMetal.' + entry.key.name())}"></span>:
      <span th:text="${entry.value}"></span> <span th:text="#{unit.pieces}">Stück</span>
      <span th:if="${totalOzByMetal.containsKey(entry.key)}">
        · <span th:text="${#numbers.formatDecimal(totalOzByMetal.get(entry.key), 1, 'DEFAULT', 3, 'DEFAULT')}"></span> oz
      </span>
    </span>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <caption>
        <div class="d-flex justify-content-between align-items-center">
          <span th:text="#{page.coins.title}">Münzen und Edelmetalle</span>
          <div class="d-flex gap-2">
            <button id="toggleAll" class="btn btn-outline-secondary btn-sm" th:text="#{common.expand-all}">Alle aufklappen</button>
            <a th:href="@{/coins/new}" class="btn btn-primary btn-sm" th:text="#{common.new}">+ Neu</a>
          </div>
        </div>
      </caption>
      <thead class="table-dark">
        <tr>
          <th scope="col" th:text="#{col.name}">Name</th>
          <th scope="col" th:text="#{col.metal}">Metall</th>
          <th scope="col" class="text-end" th:text="#{col.weight-g}">Gewicht (g)</th>
          <th scope="col" class="text-end" th:text="#{col.weight-oz}">Gewicht (oz)</th>
          <th scope="col" th:text="#{col.mint-year}">Prägejahr</th>
          <th scope="col" class="text-end" th:text="#{col.quantity}">Anzahl</th>
          <th scope="col" th:text="#{col.price-source}">Preisquelle</th>
          <th scope="col" th:text="#{col.depot}">Depot</th>
          <th scope="col" class="text-end" th:text="#{col.value.eur}">Wert (EUR)</th>
          <th scope="col" th:text="#{common.actions}">Aktionen</th>
        </tr>
      </thead>
      <tbody>
        <th:block th:each="entry, i : ${groupedCoins}" th:with="first=${entry.value.get(0)}, groupSize=${#lists.size(entry.value)}">
          <!-- Aggregierte Zeile -->
          <tr class="coin-summary fw-semibold"
              th:classappend="(${first.metal?.name() == 'GOLD'} ? 'coin-row-gold' : (${first.metal?.name() == 'SILBER'} ? 'coin-row-silber' : 'coin-row-platin')) + (${i.odd} ? ' coin-row-odd' : '')">
            <td th:text="${first.name}"></td>
            <td>
              <span class="badge"
                    th:style="${first.metal?.name() == 'GOLD'} ? 'background-color:#b8860b' : (${first.metal?.name() == 'SILBER'} ? 'background-color:#708090' : 'background-color:#6c757d')"
                    th:text="${first.metal != null ? #messages.msg('coinMetal.' + first.metal.name()) : '-'}"></span>
            </td>
            <td class="text-end" th:text="${first.weightGrams != null} ? ${#numbers.formatDecimal(first.weightGrams, 1, 'DEFAULT', 4, 'DEFAULT')} : '-'"></td>
            <td class="text-end" th:text="${first.weightOz != null} ? ${#numbers.formatDecimal(first.weightOz, 1, 'DEFAULT', 4, 'DEFAULT')} : '-'"></td>
            <td th:text="${groupSize == 1} ? ${first.mintYear ?: '-'} : '-'"></td>
            <td class="text-end" th:text="${groupedQty.get(entry.key)}"></td>
            <td>
              <a th:if="${first.asset != null}" th:href="@{/assets/{id}/edit(id=${first.asset.id})}"
                 th:text="${first.asset.name}" class="small"></a>
              <span th:unless="${first.asset != null}" class="text-muted small">Spot</span>
            </td>
            <td th:text="${groupedDepots.get(entry.key)}"></td>
            <td class="text-end">
              <span th:if="${groupedValues.get(entry.key)?.compareTo(T(java.math.BigDecimal).ZERO) > 0}"
                    th:text="${#numbers.formatDecimal(groupedValues.get(entry.key).multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')} + ' ' + ${displayCurrency}"></span>
              <span th:unless="${groupedValues.get(entry.key)?.compareTo(T(java.math.BigDecimal).ZERO) > 0}" class="text-muted">-</span>
            </td>
            <td>
              <!-- Einzelne Münze: Aktionen direkt anzeigen -->
              <th:block th:if="${groupSize == 1}">
                <div class="dropdown">
                  <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                          th:text="#{common.actions}">Aktionen</button>
                  <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/coins/{id}/edit(id=${first.id})}" th:text="#{common.edit}">Bearbeiten</a></li>
                    <li><a class="dropdown-item" th:href="@{/coins/{id}/quantities(id=${first.id})}" th:text="#{page.coins.quantities.title}">Mengenhistorie</a></li>
                    <li><hr class="dropdown-divider"/></li>
                    <li>
                      <form th:action="@{/coins/{id}/delete(id=${first.id})}" method="post"
                            th:attr="onsubmit=|return confirm('#{confirm.delete-coin}')|">
                        <button type="submit" class="dropdown-item text-danger" th:text="#{common.delete}">Löschen</button>
                      </form>
                    </li>
                  </ul>
                </div>
              </th:block>
              <!-- Mehrere Münzen: Aufklapp-Button -->
              <th:block th:if="${groupSize > 1}">
                <button class="btn btn-sm btn-outline-secondary toggle-group"
                        th:attr="data-group=${entry.key}"
                        th:data-count="${groupSize}">
                  <span th:text="${groupSize}"></span> ▶
                </button>
              </th:block>
            </td>
          </tr>
          <!-- Detail-Zeilen (nur bei mehreren Einträgen) -->
          <tr th:each="c : ${entry.value}"
              th:if="${groupSize > 1}"
              class="coin-detail d-none table-secondary"
              th:attr="data-group=${entry.key}">
            <td class="ps-4 text-muted small" th:text="${c.name}"></td>
            <td>
              <span class="badge"
                    th:style="${c.metal?.name() == 'GOLD'} ? 'background-color:#b8860b' : (${c.metal?.name() == 'SILBER'} ? 'background-color:#708090' : 'background-color:#6c757d')"
                    th:text="${c.metal != null ? #messages.msg('coinMetal.' + c.metal.name()) : '-'}"></span>
            </td>
            <td class="text-end" th:text="${c.weightGrams != null} ? ${#numbers.formatDecimal(c.weightGrams, 1, 'DEFAULT', 4, 'DEFAULT')} : '-'"></td>
            <td class="text-end" th:text="${c.weightOz != null} ? ${#numbers.formatDecimal(c.weightOz, 1, 'DEFAULT', 4, 'DEFAULT')} : '-'"></td>
            <td th:text="${c.mintYear ?: '-'}"></td>
            <td class="text-end" th:text="${c.quantity ?: '-'}"></td>
            <td>
              <a th:if="${c.asset != null}" th:href="@{/assets/{id}/edit(id=${c.asset.id})}"
                 th:text="${c.asset.name}" class="small"></a>
              <span th:unless="${c.asset != null}" class="text-muted small">Spot</span>
            </td>
            <td th:text="${c.depot?.name ?: '-'}"></td>
            <td class="text-end">
              <span th:if="${values.get(c.id) != null}"
                    th:text="${#numbers.formatDecimal(values.get(c.id).multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')} + ' ' + ${displayCurrency}"></span>
              <span th:unless="${values.get(c.id) != null}" class="text-muted">-</span>
            </td>
            <td>
              <div class="dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        th:text="#{common.actions}">Aktionen</button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><a class="dropdown-item" th:href="@{/coins/{id}/edit(id=${c.id})}" th:text="#{common.edit}">Bearbeiten</a></li>
                  <li><a class="dropdown-item" th:href="@{/coins/{id}/quantities(id=${c.id})}" th:text="#{page.coins.quantities.title}">Mengenhistorie</a></li>
                  <li><hr class="dropdown-divider"/></li>
                  <li>
                    <form th:action="@{/coins/{id}/delete(id=${c.id})}" method="post"
                          th:attr="onsubmit=|return confirm('#{confirm.delete-coin}')|">
                      <button type="submit" class="dropdown-item text-danger" th:text="#{common.delete}">Löschen</button>
                    </form>
                  </li>
                </ul>
              </div>
            </td>
          </tr>
        </th:block>
        <tr th:if="${#maps.isEmpty(groupedCoins)}">
          <td colspan="10" class="text-center text-muted" th:text="#{page.coins.empty}">Keine Münzen vorhanden.</td>
        </tr>
      </tbody>
      <tfoot th:if="${!#maps.isEmpty(groupedCoins)}">
        <tr class="table-secondary fw-bold">
          <td colspan="8" th:text="#{common.total}">Gesamt</td>
          <td class="text-end" style="white-space:nowrap" th:text="${#numbers.formatDecimal(total.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')} + ' ' + ${displayCurrency}"></td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
(function () {
  var labelExpandAll  = /*[[#{common.expand-all}]]*/ 'Alle aufklappen';
  var labelCollapseAll = /*[[#{common.collapse-all}]]*/ 'Alle zuklappen';
  function setGroupExpanded(group, expand) {
    var rows = document.querySelectorAll('tr.coin-detail[data-group="' + CSS.escape(group) + '"]');
    rows.forEach(function (r) { r.classList.toggle('d-none', !expand); });
    document.querySelectorAll('.toggle-group[data-group="' + CSS.escape(group) + '"]').forEach(function (btn) {
      btn.innerHTML = btn.dataset.count + (expand ? ' ▼' : ' ▶');
    });
  }

  document.querySelectorAll('.toggle-group').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var group = this.dataset.group;
      var firstRow = document.querySelector('tr.coin-detail[data-group="' + CSS.escape(group) + '"]');
      setGroupExpanded(group, firstRow && firstRow.classList.contains('d-none'));
    });
  });

  var toggleAllBtn = document.getElementById('toggleAll');
  if (toggleAllBtn) {
    toggleAllBtn.addEventListener('click', function () {
      var allDetail = document.querySelectorAll('tr.coin-detail');
      var anyHidden = Array.from(allDetail).some(function (r) { return r.classList.contains('d-none'); });
      document.querySelectorAll('.toggle-group').forEach(function (btn) {
        setGroupExpanded(btn.dataset.group, anyHidden);
      });
      toggleAllBtn.textContent = anyHidden ? labelCollapseAll : labelExpandAll;
    });
  }
})();
</script>
</body>
</html>
