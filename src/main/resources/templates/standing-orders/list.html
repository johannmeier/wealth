<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Daueraufträge</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Daueraufträge</h3>
    <a th:href="@{/standing-orders/new}" class="btn btn-primary">+ Neu</a>
  </div>
  <table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
      <tr><th>Wertpapier</th><th>Depot</th><th class="text-end">Betrag (€)</th>
          <th>Intervall</th><th>Nächste Ausführung</th><th>Aktiv</th><th>Aktionen</th></tr>
    </thead>
    <tbody>
      <tr th:each="o : ${orders}">
        <td th:text="${o.asset.name}"></td>
        <td th:text="${o.depot.name}"></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(o.amount, 1, 'COMMA', 2, 'POINT')}"></td>
        <td th:text="${o.interval?.label ?: '-'}"></td>
        <td th:text="${o.nextDate != null ? #temporals.format(o.nextDate, 'dd.MM.yyyy') : '-'}"></td>
        <td><span th:class="${o.active} ? 'badge bg-success' : 'badge bg-secondary'"
                  th:text="${o.active} ? 'Ja' : 'Nein'"></span></td>
        <td>
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">Aktionen</button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/standing-orders/{id}/edit(id=${o.id})}">Bearbeiten</a></li>
              <li><hr class="dropdown-divider"/></li>
              <li>
                <form th:action="@{/standing-orders/{id}/delete(id=${o.id})}" method="post"
                      onsubmit="return confirm('Wirklich löschen?')">
                  <button type="submit" class="dropdown-item text-danger">Löschen</button>
                </form>
              </li>
            </ul>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(orders)}">
        <td colspan="7" class="text-center text-muted">Keine Daueraufträge vorhanden.</td>
      </tr>
    </tbody>
  </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
