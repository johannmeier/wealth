<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.standing-orders.title}">Daueraufträge</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <table class="table table-striped table-hover align-middle">
    <caption>
      <div class="d-flex justify-content-between align-items-center">
        <span th:text="#{page.standing-orders.title}">Daueraufträge</span>
        <a th:href="@{/standing-orders/new}" class="btn btn-primary btn-sm" th:text="#{common.new}">+ Neu</a>
      </div>
    </caption>
    <thead class="table-dark">
      <tr>
        <th scope="col" th:text="#{nav.assets}">Wertpapier</th>
        <th scope="col" th:text="#{col.depot}">Depot</th>
        <th scope="col" class="text-end" th:text="#{col.amount}">Betrag (€)</th>
        <th scope="col" th:text="#{col.interval}">Intervall</th>
        <th scope="col" th:text="#{col.next-date}">Nächste Ausführung</th>
        <th scope="col" th:text="#{col.active}">Aktiv</th>
        <th scope="col" th:text="#{common.actions}">Aktionen</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="o : ${orders}">
        <td th:text="${o.asset.name}"></td>
        <td th:text="${o.depot.name}"></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(o.amount, 1, 'POINT', 2, 'COMMA')}"></td>
        <td th:text="${o.interval != null ? #messages.msg('orderInterval.' + o.interval.name()) : '-'}"></td>
        <td th:text="${o.nextDate != null ? #temporals.format(o.nextDate, 'dd.MM.yyyy') : '-'}"></td>
        <td><span th:class="${o.active} ? 'badge bg-success' : 'badge bg-secondary'"
                  th:text="${o.active} ? #{common.yes} : #{common.no}"></span></td>
        <td>
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" th:attr="aria-label=#{common.actions}" th:text="#{common.actions}">Aktionen</button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/standing-orders/{id}/edit(id=${o.id})}" th:text="#{common.edit}">Bearbeiten</a></li>
              <li><hr class="dropdown-divider"/></li>
              <li>
                <form th:action="@{/standing-orders/{id}/delete(id=${o.id})}" method="post"
                      th:attr="onsubmit=|return confirm('#{confirm.delete}')|">
                  <button type="submit" class="dropdown-item text-danger" th:text="#{common.delete}">Löschen</button>
                </form>
              </li>
            </ul>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(orders)}">
        <td colspan="7" class="text-center text-muted" th:text="#{page.standing-orders.empty}">Keine Daueraufträge vorhanden.</td>
      </tr>
    </tbody>
  </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
