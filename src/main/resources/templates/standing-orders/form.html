<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Dauerauftrag</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:600px">
  <h3 th:text="${order.id == null} ? 'Neuer Dauerauftrag' : 'Dauerauftrag bearbeiten'"></h3>
  <form th:action="@{/standing-orders/save}" th:object="${order}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <div class="mb-3">
      <label class="form-label">Wertpapier *</label>
      <select name="assetId" class="form-select" required>
        <option value="">-- wählen --</option>
        <option th:each="s : ${assets}" th:value="${s.id}" th:text="${s.name}"
                th:selected="${order.asset != null and order.asset.id == s.id}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Depot *</label>
      <select name="depotId" class="form-select" required>
        <option value="">-- wählen --</option>
        <option th:each="d : ${depots}" th:value="${d.id}" th:text="${d.name}"
                th:selected="${order.depot != null and order.depot.id == d.id}"></option>
      </select>
    </div>
    <div class="row">
      <div class="col mb-3">
        <label class="form-label">Betrag (€) *</label>
        <input type="number" th:field="*{amount}" class="form-control" step="0.01" required/>
      </div>
      <div class="col mb-3">
        <label class="form-label">Intervall</label>
        <select th:field="*{interval}" class="form-select">
          <option value="">-- wählen --</option>
          <option th:each="i : ${intervals}" th:value="${i}" th:text="${i.label}"></option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="col mb-3">
        <label class="form-label">Startdatum</label>
        <input type="date" th:field="*{startDate}" class="form-control"/>
      </div>
      <div class="col mb-3">
        <label class="form-label">Nächste Ausführung</label>
        <input type="date" th:field="*{nextDate}" class="form-control"/>
      </div>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" th:field="*{active}" class="form-check-input"/>
      <label class="form-check-label">Aktiv</label>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Speichern</button>
      <a th:href="@{/standing-orders}" class="btn btn-outline-secondary">Abbrechen</a>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
