<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.assets.price-history.title}">Kurshistorie</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div class="table-section">
  <h3><span th:text="#{page.assets.price-history.title}">Kurshistorie</span>: <span th:text="${asset.name}"></span></h3>

  <table class="table table-striped align-middle mt-3">
    <caption th:text="#{page.assets.price-history.title}">Kurshistorie</caption>
    <thead class="table-dark">
      <tr>
        <th scope="col" th:text="#{col.date}">Datum</th>
        <th scope="col" class="text-end" th:text="#{col.price}">Kurs</th>
        <th scope="col" th:text="#{col.currency}">Währung</th>
        <th scope="col" class="text-end" th:text="#{col.price.eur}">Kurs (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="h : ${priceHistory}">
        <td th:text="${#temporals.format(h.date, 'dd.MM.yyyy')}"></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(h.price, 1, 'DEFAULT', 4, 'DEFAULT')}"></td>
        <td th:text="${h.currency}"></td>
        <td class="text-end">
          <span th:if="${historyEurPrices.get(h.id) != null}"
                th:text="${#numbers.formatDecimal(historyEurPrices.get(h.id), 1, 'DEFAULT', 4, 'DEFAULT')}"></span>
          <span th:unless="${historyEurPrices.get(h.id) != null}" class="text-muted">—</span>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(priceHistory)}">
        <td colspan="4" class="text-center text-muted" th:text="#{page.assets.price-history.empty}">Noch keine Kurshistorie vorhanden.</td>
      </tr>
    </tbody>
  </table>
  <a th:href="@{/assets}" class="btn btn-outline-secondary mt-2" th:text="#{common.back}">Zurück</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
