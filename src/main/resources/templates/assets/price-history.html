<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Kurshistorie</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <h3>Kurshistorie: <span th:text="${asset.name}"></span></h3>

  <div class="table-section mt-3">
  <table class="table table-striped align-middle">
    <caption>Kurshistorie</caption>
    <thead class="table-dark">
      <tr>
        <th scope="col">Datum</th>
        <th scope="col" class="text-end">Kurs</th>
        <th scope="col">Währung</th>
        <th scope="col" class="text-end">Kurs (EUR)</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="h : ${priceHistory}">
        <td th:text="${#temporals.format(h.date, 'dd.MM.yyyy')}"></td>
        <td class="text-end" th:text="${h.price.stripTrailingZeros().toPlainString().replace('.', ',')}"></td>
        <td th:text="${h.currency}"></td>
        <td class="text-end">
          <span th:if="${historyEurPrices.get(h.id) != null}"
                th:text="${historyEurPrices.get(h.id).stripTrailingZeros().toPlainString().replace('.', ',')}"></span>
          <span th:unless="${historyEurPrices.get(h.id) != null}" class="text-muted">—</span>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(priceHistory)}">
        <td colspan="4" class="text-center text-muted">Noch keine Kurshistorie vorhanden.</td>
      </tr>
    </tbody>
  </table>
  </div>
  <a th:href="@{/assets}" class="btn btn-outline-secondary">Zurück</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
