<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Wertpapiere</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Wertpapiere</h3>
    <div class="d-flex gap-2">
      <form th:action="@{/assets/refresh-all-prices}" method="post">
        <button type="submit" class="btn btn-outline-success">Alle Kurse aktualisieren</button>
      </form>
      <a th:href="@{/assets/new}" class="btn btn-primary">+ Neu</a>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Name</th><th>ISIN</th><th>Symbol</th><th>Kategorie</th>
          <th>Art</th><th>Index</th><th>Allocation</th>
          <th>Depots</th>
          <th>Währung</th>
          <th class="text-end">Kurs (€)</th><th>Aktionen</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="s : ${assets}">
          <td th:text="${s.name}"></td>
          <td th:text="${s.isin ?: '-'}"></td>
          <td th:text="${s.symbol ?: '-'}"></td>
          <td th:text="${s.category?.label ?: '-'}"></td>
          <td th:text="${s.type?.label ?: '-'}"></td>
          <td th:text="${s.indexName ?: '-'}"></td>
          <td>
            <span th:if="${s.assetAllocation != null}"
                  th:class="${s.assetAllocation.name() == 'RISIKOBEHAFTET'} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                  th:text="${s.assetAllocation.label}"></span>
          </td>
          <td class="small">
            <span th:if="${depotsByAsset.get(s.id) == null}" class="text-muted">-</span>
            <span th:each="entry, i : ${depotsByAsset.get(s.id)}">
              <a th:href="@{/depots/{id}/positions(id=${entry.key})}" th:text="${entry.value}"></a><span th:unless="${i.last}">, </span>
            </span>
          </td>
          <td th:text="${s.currency ?: '-'}"></td>
          <td class="text-end">
            <span th:if="${eurPrices.get(s.id) != null}"
                  th:text="${eurPrices.get(s.id).stripTrailingZeros().toPlainString().replace('.', ',')}"></span>
            <span th:unless="${eurPrices.get(s.id) != null}" class="text-muted">-</span>
          </td>
          <td>
            <div class="dropdown">
              <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                Aktionen
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" th:href="@{/assets/{id}/edit(id=${s.id})}">Bearbeiten</a></li>
                <li><a class="dropdown-item" th:href="@{/assets/{id}/quantities(id=${s.id})}">Bestände</a></li>
                <li><a class="dropdown-item" th:href="@{/assets/{id}/price-history(id=${s.id})}">Kurshistorie</a></li>
                <li th:if="${s.autoPrice}">
                  <form th:action="@{/assets/{id}/refresh-price(id=${s.id})}" method="post">
                    <button type="submit" class="dropdown-item">Kurs aktualisieren</button>
                  </form>
                </li>
                <li><hr class="dropdown-divider"/></li>
                <li>
                  <form th:action="@{/assets/{id}/delete(id=${s.id})}" method="post"
                        onsubmit="return confirm('Wertpapier archivieren? Die Kurs- und Bestandshistorie bleibt erhalten.')">
                    <button type="submit" class="dropdown-item text-secondary">Archivieren</button>
                  </form>
                </li>
              </ul>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(assets)}">
          <td colspan="9" class="text-center text-muted">Keine Wertpapiere vorhanden.</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div th:if="${!#lists.isEmpty(archivedAssets)}" class="mt-5">
    <h5 class="text-muted">Archiviert</h5>
    <div class="table-responsive">
      <table class="table table-sm align-middle text-muted">
        <thead>
          <tr><th>Name</th><th>ISIN</th><th>Symbol</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="s : ${archivedAssets}">
            <td th:text="${s.name}"></td>
            <td th:text="${s.isin ?: '-'}"></td>
            <td th:text="${s.symbol ?: '-'}"></td>
            <td>
              <form th:action="@{/assets/{id}/restore(id=${s.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-success">Wiederherstellen</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
