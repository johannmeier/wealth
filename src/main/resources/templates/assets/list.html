<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.assets.title}">Wertpapiere</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4" style="overflow-x: hidden">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
    <span class="fw-semibold" th:text="#{page.assets.title}">Wertpapiere</span>
    <div class="d-flex gap-2 align-items-center flex-wrap">
      <form class="m-0" th:action="@{/assets/refresh-all-prices}" method="post">
        <button type="submit" class="btn btn-outline-success btn-sm" th:text="#{common.refresh-all}">Alle Kurse aktualisieren</button>
      </form>
      <a th:href="@{/assets/new}" class="btn btn-primary btn-sm" th:text="#{common.new}">+ Neu</a>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <caption class="visually-hidden" th:text="#{page.assets.title}">Wertpapiere</caption>
      <thead class="table-dark">
        <tr>
          <th scope="col" th:text="#{col.name}">Name</th>
          <th scope="col" th:text="#{col.isin}">ISIN</th>
          <th scope="col" class="d-none d-xl-table-cell" th:text="#{col.properties}">Eigenschaften</th>
          <th scope="col" th:text="#{col.index}">Index</th>
          <th scope="col" th:text="#{col.depots}">Depots</th>
          <th scope="col" class="text-end" th:text="#{col.price}">Kurs</th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="s : ${assets}" th:attr="data-id=${s.id}">
          <td th:text="${s.name}"></td>
          <td>
            <div th:text="${s.isin ?: '-'}"></div>
            <small th:if="${s.symbol != null}" class="text-muted" th:text="${s.symbol}"></small>
          </td>
          <td class="d-none d-xl-table-cell">
            <span th:if="${s.type != null}" class="badge bg-primary me-1"
                  th:text="${#messages.msg('assetType.' + s.type.name())}"></span>
            <span th:if="${s.category != null}" class="badge bg-secondary me-1"
                  th:text="${#messages.msg('assetCategory.' + s.category.name())}"></span>
            <span th:if="${s.distributionPolicy != null}"
                  th:class="${s.distributionPolicy.name() == 'AUSSCHUETTEND'} ? 'badge bg-info text-dark me-1' : 'badge bg-primary me-1'"
                  th:text="${#messages.msg('distributionPolicy.' + s.distributionPolicy.name())}"></span>
            <span th:if="${s.assetAllocation != null}"
                  th:class="${s.assetAllocation.name() == 'RISIKOBEHAFTET'} ? 'badge bg-warning text-dark me-1' : 'badge bg-success me-1'"
                  th:text="${#messages.msg('assetAllocation.' + s.assetAllocation.name())}"></span>
          </td>
          <td style="white-space:nowrap" th:text="${s.indexName ?: '-'}"></td>
          <td class="small">
            <span th:if="${depotsByAsset.get(s.id) == null}" class="text-muted">-</span>
            <span th:each="entry, i : ${depotsByAsset.get(s.id)}">
              <a th:href="@{/depots/{id}/positions(id=${entry.key},returnUrl='/assets')}" th:text="${entry.value}"></a><span th:unless="${i.last}">, </span>
            </span>
          </td>
          <td class="text-end">
            <th:block th:if="${s.currentPrice != null}">
              <th:block th:if="${s.currency == null or s.currency == 'EUR'}">
                <span style="white-space:nowrap"
                      th:text="${#numbers.formatDecimal(s.currentPrice, 1, 'DEFAULT', 2, 'DEFAULT')} + ' EUR'"></span>
              </th:block>
              <th:block th:unless="${s.currency == null or s.currency == 'EUR'}">
                <span style="white-space:nowrap"
                      th:text="${#numbers.formatDecimal(s.currentPrice, 1, 'DEFAULT', 2, 'DEFAULT')} + ' ' + ${s.currency}"></span>
                <th:block th:if="${eurPrices.get(s.id) != null}">
                  <br/>
                  <small class="text-muted" style="white-space:nowrap"
                         th:text="${#numbers.formatDecimal(eurPrices.get(s.id), 1, 'DEFAULT', 2, 'DEFAULT')} + ' EUR'"></small>
                </th:block>
              </th:block>
            </th:block>
            <span th:unless="${s.currentPrice != null}" class="text-muted">-</span>
          </td>
          <td>
            <div class="dropdown">
              <button class="btn btn-sm btn-outline-secondary" type="button"
                      data-bs-toggle="dropdown" th:attr="aria-label=#{common.actions}">&#x2630;</button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" th:href="@{/assets/{id}/edit(id=${s.id})}" th:text="#{common.edit}">Bearbeiten</a></li>
                <li><a class="dropdown-item" th:href="@{/assets/{id}/quantities(id=${s.id})}" th:text="#{page.assets.quantities.title}">Bestände</a></li>
                <li><a class="dropdown-item" th:href="@{/assets/{id}/price-history(id=${s.id})}" th:text="#{page.assets.price-history.title}">Kurshistorie</a></li>
                <li th:if="${s.autoPrice}">
                  <form th:action="@{/assets/{id}/refresh-price(id=${s.id})}" method="post">
                    <button type="submit" class="dropdown-item" th:text="#{common.refresh}">Kurs aktualisieren</button>
                  </form>
                </li>
                <li><hr class="dropdown-divider"/></li>
                <li th:if="${deletableActiveIds.contains(s.id)}">
                  <form th:action="@{/assets/{id}/hard-delete(id=${s.id})}" method="post"
                        th:attr="onsubmit=|return confirm('#{confirm.hard-delete}')|">
                    <button type="submit" class="dropdown-item text-danger" th:text="#{common.delete}">Löschen</button>
                  </form>
                </li>
                <li th:unless="${deletableActiveIds.contains(s.id)}">
                  <form th:action="@{/assets/{id}/delete(id=${s.id})}" method="post"
                        th:attr="onsubmit=|return confirm('#{confirm.archive}')|">
                    <button type="submit" class="dropdown-item text-secondary" th:text="#{common.archive}">Archivieren</button>
                  </form>
                </li>
              </ul>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(assets)}">
          <td colspan="7" class="text-center text-muted" th:text="#{page.assets.empty}">Keine Wertpapiere vorhanden.</td>
        </tr>
      </tbody>
    </table>
  </div>
  </div>
  <div th:if="${!#lists.isEmpty(archivedAssets)}" class="table-section mt-5">
    <h5 class="text-muted" th:text="#{page.assets.archived}">Archiviert</h5>
    <div class="table-responsive">
      <table class="table table-sm align-middle text-muted">
        <caption th:text="#{page.assets.archived}">Archivierte Wertpapiere</caption>
        <thead>
          <tr>
            <th scope="col" th:text="#{col.name}">Name</th>
            <th scope="col" th:text="#{col.isin}">ISIN</th>
            <th scope="col" th:text="#{col.symbol}">Symbol</th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${archivedAssets}" th:attr="data-id=${s.id}">
            <td th:text="${s.name}"></td>
            <td th:text="${s.isin ?: '-'}"></td>
            <td th:text="${s.symbol ?: '-'}"></td>
            <td class="d-flex gap-2">
              <form th:action="@{/assets/{id}/restore(id=${s.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-success" th:text="#{common.restore}">Wiederherstellen</button>
              </form>
              <form th:if="${deletableIds.contains(s.id)}"
                    th:action="@{/assets/{id}/hard-delete(id=${s.id})}" method="post" class="d-inline"
                    th:attr="onsubmit=|return confirm('#{confirm.hard-delete}')|">
                <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">Löschen</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<style>
.row-highlight td { background-color: #fff3cd !important; color: #212529 !important; }
[data-bs-theme="dark"] .row-highlight td { background-color: #5a4a00 !important; color: #f8f9fa !important; }
</style>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
(function () {
  var id = /*[[${highlightId}]]*/ null;
  if (!id) return;
  var row = document.querySelector('tr[data-id="' + id + '"]');
  if (!row) return;
  row.classList.add('row-highlight');
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
})();
</script>
</body>
</html>
