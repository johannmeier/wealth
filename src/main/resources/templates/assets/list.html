<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Wertpapiere</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Wertpapiere</h3>
    <a th:href="@{/assets/new}" class="btn btn-primary">+ Neu</a>
  </div>
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Name</th><th>ISIN</th><th>Symbol</th><th>Kategorie</th>
          <th>Art</th><th>Index</th><th>Allocation</th>
          <th class="text-end">Kurs (€)</th><th>Aktionen</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="s : ${assets}">
          <td th:text="${s.name}"></td>
          <td th:text="${s.isin ?: '-'}"></td>
          <td th:text="${s.symbol ?: '-'}"></td>
          <td th:text="${s.category?.label ?: '-'}"></td>
          <td th:text="${s.type?.label ?: '-'}"></td>
          <td th:text="${s.indexName ?: '-'}"></td>
          <td>
            <span th:if="${s.assetAllocation != null}"
                  th:class="${s.assetAllocation.name() == 'RISIKOBEHAFTET'} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                  th:text="${s.assetAllocation.label}"></span>
          </td>
          <td class="text-end">
            <span th:if="${eurPrices.get(s.id) != null}"
                  th:text="${#numbers.formatDecimal(eurPrices.get(s.id), 1, 'COMMA', 2, 'POINT')}"></span>
            <span th:unless="${eurPrices.get(s.id) != null}" class="text-muted">-</span>
          </td>
          <td>
            <a th:href="@{/assets/{id}/edit(id=${s.id})}" class="btn btn-sm btn-outline-secondary">Bearbeiten</a>
            <a th:href="@{/assets/{id}/quantities(id=${s.id})}" class="btn btn-sm btn-outline-info">Bestände</a>
            <a th:href="@{/assets/{id}/price-history(id=${s.id})}" class="btn btn-sm btn-outline-secondary">Kurse</a>
            <form th:if="${s.autoPrice}" th:action="@{/assets/{id}/refresh-price(id=${s.id})}" method="post" class="d-inline">
              <button type="submit" class="btn btn-sm btn-outline-success">Kurs</button>
            </form>
            <form th:action="@{/assets/{id}/delete(id=${s.id})}" method="post" class="d-inline"
                  onsubmit="return confirm('Wirklich löschen?')">
              <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(assets)}">
          <td colspan="9" class="text-center text-muted">Keine Wertpapiere vorhanden.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
