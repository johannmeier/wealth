<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.assets.quantities.title}">Bestände</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <h3><span th:text="#{page.assets.quantities.title}">Bestände</span>: <span th:text="${asset.name}"></span></h3>

  <div class="card mb-4" style="max-width:500px">
    <div class="card-header" th:text="#{page.assets.quantities.new}">Neuer Bestand</div>
    <div class="card-body">
      <form th:action="@{/assets/{id}/quantities/save(id=${asset.id})}" method="post">
        <div class="mb-3">
          <label class="form-label" for="qty-depot" th:text="#{col.depot}">Depot</label>
          <select id="qty-depot" name="depotId" class="form-select" required>
            <option value="" th:text="#{form.select}">-- wählen --</option>
            <option th:each="d : ${depots}" th:value="${d.id}" th:text="${d.name}"></option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="qty-date" th:text="#{col.date}">Datum</label>
          <input type="date" id="qty-date" name="date" class="form-control"
                 th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"/>
        </div>
        <div class="mb-3">
          <label class="form-label" for="qty-quantity" th:text="#{col.quantity}">Anzahl</label>
          <input type="number" id="qty-quantity" name="quantity" class="form-control" step="any" required/>
        </div>
        <button type="submit" class="btn btn-primary" th:text="#{common.save}">Speichern</button>
      </form>
    </div>
  </div>

  <table class="table table-striped align-middle">
    <caption th:text="#{page.assets.quantities.history}">Bestandshistorie</caption>
    <thead class="table-dark">
      <tr>
        <th scope="col" th:text="#{col.date}">Datum</th>
        <th scope="col" th:text="#{col.depot}">Depot</th>
        <th scope="col" class="text-end" th:text="#{col.quantity}">Anzahl</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="q : ${quantities}">
        <td th:text="${#temporals.format(q.date, 'dd.MM.yyyy')}"></td>
        <td th:text="${q.depot.name}"></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(q.quantity, 1, 'DEFAULT', 4, 'DEFAULT')}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(quantities)}">
        <td colspan="3" class="text-center text-muted" th:text="#{page.assets.quantities.empty}">Noch keine Bestände eingetragen.</td>
      </tr>
    </tbody>
  </table>
  <a th:href="@{/assets}" class="btn btn-outline-secondary mt-2" th:text="#{common.back}">Zurück</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
