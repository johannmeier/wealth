<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${asset.id == null} ? #{form.new-asset} : #{form.edit-asset}">Wertpapier</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:700px">
  <h3 th:text="${asset.id == null} ? #{form.new-asset} : #{form.edit-asset}">Wertpapier</h3>

  <div th:if="${asset.id == null}" class="card mb-4 border-0 bg-light">
    <div class="card-body pb-2">
      <label class="form-label fw-semibold" th:text="#{form.search-label}">Suche</label>
      <div class="input-group">
        <input type="text" id="searchInput" class="form-control"
               th:placeholder="#{form.search-placeholder}" autocomplete="off"/>
        <button type="button" class="btn btn-outline-secondary" id="clearBtn" style="display:none"
                onclick="clearSearch()">&#x2715;</button>
      </div>
      <div id="searchResults" class="list-group mt-1 shadow-sm" style="display:none; max-height:280px; overflow-y:auto; position:relative; z-index:10;"></div>
      <small class="text-muted" th:text="#{form.search-hint}">Ergebnisse von Yahoo Finance</small>
    </div>
  </div>

  <form th:action="@{/assets/save}" th:object="${asset}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <input type="hidden" name="returnUrl" th:value="${returnUrl}"/>
    <div class="mb-3">
      <label class="form-label" th:text="#{col.name} + ' *'">Name *</label>
      <input type="text" th:field="*{name}" class="form-control" required/>
    </div>
    <div class="row">
      <div class="col mb-3">
        <label class="form-label" th:text="#{col.isin}">ISIN</label>
        <input type="text" th:field="*{isin}" class="form-control" placeholder="DE0001234567"/>
      </div>
      <div class="col mb-3">
        <label class="form-label">Symbol (Yahoo Finance)</label>
        <input type="text" th:field="*{symbol}" class="form-control" placeholder="AAPL, GC=F"/>
      </div>
    </div>
    <div class="row row-cols-1 row-cols-sm-3 row-cols-lg-5 g-3 mb-3">
      <div class="col" th:each="def : ${criteriaDefinitions}">
        <label class="form-label" th:text="${def.name}">Kriterium</label>
        <select th:if="${def.valueType.name() == 'FIXED_LIST'}"
                th:name="|crit_${def.id}|"
                th:id="${def.systemCode != null} ? ('crit-' + ${def.systemCode}) : null"
                class="form-select">
          <option value="" th:text="#{form.select}">-- wählen --</option>
          <option th:each="o : ${criteriaOptions.get(def.id)}" th:value="${o.id}"
                  th:attr="data-system-code=${o.systemCode}"
                  th:text="${o.value}"
                  th:selected="${assetCriteriaValues.get(def.id) != null and assetCriteriaValues.get(def.id).option != null and assetCriteriaValues.get(def.id).option.id == o.id}"></option>
        </select>
        <input th:unless="${def.valueType.name() == 'FIXED_LIST'}"
               type="text" class="form-control"
               th:name="|crit_${def.id}|"
               th:id="${def.systemCode != null} ? ('crit-' + ${def.systemCode}) : null"
               th:value="${assetCriteriaValues.get(def.id)?.freeTextValue}"/>
      </div>
    </div>
    <div class="row">
      <div class="col mb-3">
        <label class="form-label" th:text="#{col.currency}">Währung</label>
        <input type="text" th:field="*{currency}" class="form-control" placeholder="EUR"/>
      </div>
      <div class="col mb-3">
        <label class="form-label" th:text="#{form.current-price}">Aktueller Kurs</label>
        <input type="number" th:field="*{currentPrice}" class="form-control" step="any"/>
      </div>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" th:text="#{common.save}">Speichern</button>
      <a th:href="${returnUrl}"
         class="btn btn-outline-secondary" th:text="#{common.cancel}">Abbrechen</a>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
(function () {
  const searchInput = document.getElementById('searchInput');
  if (!searchInput) return;

  const resultsBox = document.getElementById('searchResults');
  const clearBtn   = document.getElementById('clearBtn');
  const msgNoResults = /*[[#{form.search-no-results}]]*/ 'Keine Treffer';
  const msgError     = /*[[#{form.search-error}]]*/ 'Suche fehlgeschlagen';
  let timer;

  searchInput.addEventListener('input', function () {
    clearTimeout(timer);
    const q = this.value.trim();
    clearBtn.style.display = q ? 'inline-block' : 'none';
    if (q.length < 2) { hide(); return; }
    timer = setTimeout(() => doSearch(q), 350);
  });

  function doSearch(q) {
    fetch('/assets/search?q=' + encodeURIComponent(q))
      .then(r => r.json())
      .then(list => {
        resultsBox.innerHTML = '';
        if (!list.length) {
          resultsBox.innerHTML = '<div class="list-group-item text-muted">' + esc(msgNoResults) + '</div>';
        } else {
          list.forEach(r => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
            btn.innerHTML =
              '<span><strong>' + esc(r.name) + '</strong>' +
              ' <small class="text-muted">' + esc(r.symbol) + ' &middot; ' + esc(r.exchange) +
              (r.isin ? ' &middot; ' + esc(r.isin) : '') + '</small></span>' +
              '<span class="badge bg-secondary ms-2">' + esc(r.type) + '</span>';
            btn.addEventListener('click', () => fill(r));
            resultsBox.appendChild(btn);
          });
        }
        resultsBox.style.display = 'block';
      })
      .catch(() => {
        resultsBox.innerHTML = '<div class="list-group-item text-danger">' + esc(msgError) + '</div>';
        resultsBox.style.display = 'block';
      });
  }

  function fill(r) {
    set('name',     r.name);
    set('symbol',   r.symbol);
    set('currency', r.currency || 'EUR');
    selectOption('crit-CATEGORY',             r.category);
    selectOption('crit-TYPE',                 r.type);
    selectOption('crit-ASSET_ALLOCATION',     r.assetAllocation);
    selectOption('crit-DISTRIBUTION_POLICY',  r.distributionPolicy);
    // If search query itself is an ISIN, use it; otherwise use result's ISIN if present
    const query = searchInput.value.trim();
    const isin = r.isin || (/^[A-Z]{2}[A-Z0-9]{10}$/i.test(query) ? query.toUpperCase() : '');
    if (isin) set('isin', isin);
    hide();
    searchInput.value = r.name;
    clearBtn.style.display = 'inline-block';
    if (r.symbol) {
      fetch('/assets/quote-details?symbol=' + encodeURIComponent(r.symbol))
        .then(res => res.json())
        .then(d => { if (d.currency) set('currency', d.currency); })
        .catch(() => {});
    }
    if (!isin) {
      const isinEl = document.getElementById('isin');
      if (isinEl) isinEl.focus();
    }
  }

  function set(id, val) {
    const el = document.getElementById(id);
    if (el && val != null) el.value = val;
  }

  function selectOption(id, code) {
    const sel = document.getElementById(id);
    if (!sel || !code) return;
    for (const opt of sel.options) {
      if (opt.dataset.systemCode === code) { opt.selected = true; return; }
    }
  }

  function hide() { resultsBox.style.display = 'none'; }

  function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  window.clearSearch = function () {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    hide();
  };

  document.addEventListener('click', e => {
    if (!resultsBox.contains(e.target) && e.target !== searchInput) hide();
  });
})();
</script>
</body>
</html>
