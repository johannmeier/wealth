<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.info.title}">Info</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5" style="max-width:640px">
  <h3 class="mb-4" th:text="#{page.info.title}">Programminformation</h3>
  <div th:if="${updateAvailable}" class="alert alert-info d-flex justify-content-between align-items-center">
    <span th:text="#{page.info.update-available} + ' ' + ${latestVersion}"></span>
    <a th:if="${releaseUrl}" th:href="${releaseUrl}" target="_blank" rel="noopener"
       class="btn btn-sm btn-primary" th:text="#{page.info.update-download}">Herunterladen</a>
  </div>
  <table class="table table-bordered">
    <tbody>
      <tr>
        <th class="table-secondary" style="width:40%" th:text="#{page.info.version}">Version</th>
        <td th:text="${version}"></td>
      </tr>
      <tr>
        <th class="table-secondary" th:text="#{page.info.config-path}">Konfigurationsdatei</th>
        <td><code th:text="${configPath}"></code></td>
      </tr>
      <tr>
        <th class="table-secondary" th:text="#{page.info.db-path}">Datenbankdatei</th>
        <td><code th:text="${dbPath}"></code></td>
      </tr>
      <tr>
        <th class="table-secondary" th:text="#{page.info.author}">Autor</th>
        <td th:text="#{page.info.author.value}">Wolfgang Schneider</td>
      </tr>
      <tr>
        <th class="table-secondary" th:text="#{page.info.license}">Lizenz</th>
        <td th:text="#{page.info.license.text}">PolyForm Noncommercial 1.0.0</td>
      </tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
