<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Info – Wealth</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5" style="max-width:640px">
  <h3 class="mb-4">Programminformation</h3>
  <table class="table table-bordered">
    <tbody>
      <tr>
        <th class="table-secondary" style="width:40%">Version</th>
        <td th:text="${version}"></td>
      </tr>
      <tr>
        <th class="table-secondary">Konfigurationsdatei</th>
        <td><code th:text="${configPath}"></code></td>
      </tr>
      <tr>
        <th class="table-secondary">Datenbankdatei</th>
        <td><code th:text="${dbPath}"></code></td>
      </tr>
      <tr>
        <th class="table-secondary">Autor</th>
        <td>Wolfgang Schneider</td>
      </tr>
      <tr>
        <th class="table-secondary">Lizenz</th>
        <td>MIT &ndash; Freie Nutzung, Weitergabe und Änderung erlaubt, solange dieser Hinweis erhalten bleibt.</td>
      </tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
