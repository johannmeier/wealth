<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.criteria.title}">Kriterien</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <table class="table table-striped table-hover align-middle">
    <caption>
      <div class="d-flex justify-content-between align-items-center">
        <span th:text="#{page.criteria.title}">Kriterien</span>
        <a th:if="${licensedCustomCriteria}" th:href="@{/criteria/new}" class="btn btn-primary btn-sm" th:text="#{common.new}">+ Neu</a>
      </div>
    </caption>
    <thead class="table-dark">
      <tr>
        <th scope="col" th:text="#{form.criteria-name}">Name</th>
        <th scope="col" th:text="#{form.criteria-value-type}">Werttyp</th>
        <th scope="col" th:text="#{common.actions}">Aktionen</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="d : ${definitions}">
        <td>
          <span th:if="${d.colorIndex != null}" th:class="'badge me-1 crit-color-' + ${d.colorIndex}">&nbsp;&nbsp;</span>
          <span th:text="${d.name}"></span>
        </td>
        <td th:text="${#messages.msg('criteriaValueType.' + d.valueType.name())}"></td>
        <td>
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary" type="button"
                    data-bs-toggle="dropdown" th:attr="aria-label=#{common.actions}">&#x2630;</button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/criteria/{id}/edit(id=${d.id})}" th:text="#{common.edit}">Bearbeiten</a></li>
              <li th:if="${d.valueType.name() == 'FIXED_LIST'}">
                <a class="dropdown-item" th:href="@{/criteria/{id}/options(id=${d.id})}" th:text="#{page.criteria.options.title}">Werte verwalten</a>
              </li>
              <th:block th:if="${d.deletable}">
                <li><hr class="dropdown-divider"/></li>
                <li>
                  <button type="button" class="dropdown-item text-danger" data-bs-toggle="modal"
                          data-bs-target="#criteria-delete-modal"
                          th:attr="onclick=|document.getElementById('criteria-delete-form').action='@{/criteria/{id}/delete(id=${d.id})}';|"
                          th:text="#{common.delete}">Löschen</button>
                </li>
              </th:block>
            </ul>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(definitions)}">
        <td colspan="3" class="text-center text-muted" th:text="#{page.criteria.empty}">Keine Kriterien vorhanden.</td>
      </tr>
    </tbody>
  </table>
  </div>

  <div class="modal fade" id="criteria-delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{common.delete}">Löschen</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" th:attr="aria-label=#{common.close}"></button>
        </div>
        <div class="modal-body" th:text="#{confirm.delete-criteria}">Kriterium wirklich löschen?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{common.cancel}">Abbrechen</button>
          <form id="criteria-delete-form" method="post">
            <button type="submit" class="btn btn-danger" th:text="#{common.delete}">Löschen</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
