<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.criteria.options.title}">Werte verwalten</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <div class="row g-4 align-items-start">
    <div class="col-lg-4">
      <h3 th:text="${definition.name}"></h3>
      <div class="card">
        <div class="card-header" th:text="#{page.criteria.options.new}">Neuer Wert</div>
        <div class="card-body">
          <form th:action="@{/criteria/{id}/options/save(id=${definition.id})}" method="post">
            <div class="mb-3">
              <label class="form-label" th:text="#{col.value}">Wert</label>
              <input type="text" name="value" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Speichern</button>
          </form>
        </div>
      </div>
      <a th:href="@{/criteria}" class="btn btn-outline-secondary mt-3" th:text="#{common.back}">Zurück</a>
    </div>
    <div class="col-lg-8">
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <caption th:text="#{page.criteria.options.title}">Werte</caption>
          <thead class="table-dark">
            <tr>
              <th scope="col" th:text="#{col.value}">Wert</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="o : ${options}">
              <td>
                <form th:action="@{/criteria/{id}/options/save(id=${definition.id})}" method="post" class="d-flex gap-2">
                  <input type="hidden" name="optionId" th:value="${o.id}"/>
                  <input type="text" name="value" class="form-control form-control-sm" th:value="${o.value}" required/>
                  <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="#{common.save}">Speichern</button>
                </form>
              </td>
              <td>
                <form th:if="${o.deletable}" th:action="@{/criteria/{id}/options/{oid}/delete(id=${definition.id},oid=${o.id})}" method="post"
                      th:attr="onsubmit=|return confirm('#{confirm.delete-criteria-option}')|">
                  <button type="submit" class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">Löschen</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(options)}">
              <td colspan="2" class="text-center text-muted" th:text="#{page.criteria.options.empty}">Noch keine Werte definiert.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
