<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${definition.id == null} ? #{form.new-criteria} : #{form.edit-criteria}">Kriterium</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:500px">
  <h3 th:text="${definition.id == null} ? #{form.new-criteria} : #{form.edit-criteria}">Kriterium</h3>
  <form th:action="@{/criteria/save}" th:object="${definition}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <div class="mb-3">
      <label class="form-label" th:text="#{form.criteria-name}">Name</label>
      <input type="text" th:field="*{name}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label" th:text="#{form.criteria-value-type}">Werttyp</label>
      <select th:if="${definition.id == null}" th:field="*{valueType}" class="form-select">
        <option th:value="FIXED_LIST" th:text="#{criteriaValueType.FIXED_LIST}"></option>
        <option th:value="FREE_TEXT" th:text="#{criteriaValueType.FREE_TEXT}"></option>
      </select>
      <input th:unless="${definition.id == null}" type="text" class="form-control" disabled
             th:value="${#messages.msg('criteriaValueType.' + definition.valueType.name())}"/>
    </div>
    <div class="mb-3">
      <label class="form-label" th:text="#{form.criteria-color}">Farbe</label>
      <div class="d-flex flex-wrap gap-2">
        <label th:each="i : ${colorIndexes}" class="crit-color-swatch">
          <input type="radio" th:field="*{colorIndex}" th:value="${i}" class="visually-hidden"/>
          <span th:class="'crit-color-swatch-dot crit-color-' + ${i}"></span>
        </label>
      </div>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" th:text="#{common.save}">Speichern</button>
      <a th:href="@{/criteria}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Abbrechen</a>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
