<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Konto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:500px">
  <h3 th:text="${account.id == null} ? 'Neues Konto' : 'Konto bearbeiten'"></h3>
  <form th:action="@{/accounts/save}" th:object="${account}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <div class="mb-3">
      <label class="form-label">Bank *</label>
      <input type="text" th:field="*{bank}" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Kontonummer</label>
      <input type="text" th:field="*{accountNumber}" class="form-control"/>
    </div>
    <div class="mb-3">
      <label class="form-label">IBAN</label>
      <input type="text" th:field="*{iban}" class="form-control" placeholder="DE00 0000 0000 0000 0000 00"/>
    </div>
    <div class="mb-3">
      <label class="form-label">Beschreibung</label>
      <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Optionale Beschreibung"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Währung</label>
      <input type="text" th:field="*{currency}" class="form-control" placeholder="EUR"/>
    </div>
    <div class="mb-3">
      <label class="form-label">Asset Allocation</label>
      <select th:field="*{assetAllocation}" class="form-select">
        <option value="">-- wählen --</option>
        <option th:each="a : ${allocations}" th:value="${a}" th:text="${a.label}"></option>
      </select>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Speichern</button>
      <a th:href="@{/accounts}" class="btn btn-outline-secondary">Abbrechen</a>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
