<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${account.id == null} ? #{form.new-account} : #{form.edit-account}">Konto</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:500px">
  <h3 th:text="${account.id == null} ? #{form.new-account} : #{form.edit-account}">Konto</h3>
  <form th:action="@{/accounts/save}" th:object="${account}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <div class="mb-3">
      <label class="form-label" th:text="#{col.bank}">Bank</label>
      <select name="bankId" class="form-select">
        <option value="" th:text="#{form.select}">-- wählen --</option>
        <option th:each="b : ${banks}" th:value="${b.id}" th:text="${b.name}"
                th:selected="${account.bank != null and account.bank.id == b.id}"></option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" th:text="#{col.account-number}">Kontonummer</label>
      <input type="text" th:field="*{accountNumber}" class="form-control"/>
    </div>
    <div class="mb-3">
      <label class="form-label" th:text="#{col.iban}">IBAN</label>
      <input type="text" th:field="*{iban}" class="form-control" placeholder="DE00 0000 0000 0000 0000 00"/>
    </div>
    <div class="mb-3">
      <label class="form-label" th:text="#{col.description}">Beschreibung</label>
      <textarea th:field="*{description}" class="form-control" rows="3"
                th:placeholder="#{form.optional-desc}"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label" th:text="#{col.currency}">Währung</label>
      <input type="text" th:field="*{currency}" class="form-control" placeholder="EUR"/>
    </div>
    <div class="mb-3">
      <label class="form-label" th:text="#{field.ownership-share}">Eigentumsanteil %</label>
      <input type="number" th:field="*{ownershipShare}" class="form-control" step="0.01" min="0" max="100"
             placeholder="100"/>
      <div class="form-text" th:text="#{field.ownership-share.hint.account}">Optional.</div>
    </div>
    <!-- Superseded by the generic criteria system below; kept as a hidden field so existing
         values round-trip unchanged instead of being silently reset to the field's default. -->
    <input type="hidden" th:field="*{assetAllocation}"/>
    <div class="d-flex flex-wrap gap-3 mb-3">
      <div th:each="def : ${criteriaDefinitions}">
        <label class="form-label" th:text="${def.name}">Kriterium</label>
        <select th:if="${def.valueType.name() == 'FIXED_LIST'}"
                th:name="|crit_${def.id}|"
                class="form-select" style="width:auto">
          <option value="" th:text="#{form.select}">-- wählen --</option>
          <option th:each="o : ${criteriaOptions.get(def.id)}" th:value="${o.id}"
                  th:text="${o.value}"
                  th:selected="${accountCriteriaValues.get(def.id) != null and accountCriteriaValues.get(def.id).option != null and accountCriteriaValues.get(def.id).option.id == o.id}"></option>
        </select>
        <input th:unless="${def.valueType.name() == 'FIXED_LIST'}"
               type="text" class="form-control" style="width:auto"
               th:name="|crit_${def.id}|"
               th:value="${accountCriteriaValues.get(def.id)?.freeTextValue}"/>
      </div>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" th:text="#{common.save}">Speichern</button>
      <a th:href="@{/accounts}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Abbrechen</a>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
