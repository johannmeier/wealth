<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Konten</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Konten</h3>
    <a th:href="@{/accounts/new}" class="btn btn-primary">+ Neu</a>
  </div>
  <table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
      <tr><th>Name</th><th>Währung</th><th>Allocation</th><th class="text-end">Aktueller Saldo</th><th>Aktionen</th></tr>
    </thead>
    <tbody>
      <tr th:each="a : ${accounts}">
        <td th:text="${a.name}"></td>
        <td th:text="${a.currency}"></td>
        <td>
          <span th:if="${a.assetAllocation != null}"
                th:class="${a.assetAllocation.name() == 'RISIKOBEHAFTET'} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                th:text="${a.assetAllocation.label}"></span>
        </td>
        <td class="text-end">
          <span th:if="${latestBalances.containsKey(a.id)}"
                th:text="${#numbers.formatDecimal(latestBalances.get(a.id), 1, 'COMMA', 2, 'POINT')} + ' ' + ${a.currency}"></span>
          <span th:unless="${latestBalances.containsKey(a.id)}" class="text-muted">—</span>
        </td>
        <td>
          <a th:href="@{/accounts/{id}/edit(id=${a.id})}" class="btn btn-sm btn-outline-secondary">Bearbeiten</a>
          <a th:href="@{/accounts/{id}/balances(id=${a.id})}" class="btn btn-sm btn-outline-info">Salden</a>
          <form th:action="@{/accounts/{id}/delete(id=${a.id})}" method="post" class="d-inline"
                onsubmit="return confirm('Wirklich löschen?')">
            <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(accounts)}">
        <td colspan="5" class="text-center text-muted">Keine Konten vorhanden.</td>
      </tr>
    </tbody>
    <tfoot th:if="${!#lists.isEmpty(accounts)}">
      <tr class="table-secondary fw-bold">
        <td colspan="3">Gesamt</td>
        <td class="text-end" th:text="${#numbers.formatDecimal(balanceTotal, 1, 'COMMA', 2, 'POINT')} + ' EUR'"></td>
        <td></td>
      </tr>
    </tfoot>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
