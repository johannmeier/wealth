<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Konten</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" aria-label="Schließen" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <table class="table table-striped table-hover align-middle">
    <caption>
      <div class="d-flex justify-content-between align-items-center">
        <span>Konten</span>
        <a th:href="@{/accounts/new}" class="btn btn-primary btn-sm">+ Neu</a>
      </div>
    </caption>
    <thead class="table-dark">
      <tr>
        <th scope="col">Bank</th>
        <th scope="col">Kontonummer</th>
        <th scope="col">Währung</th>
        <th scope="col">Allocation</th>
        <th scope="col" class="text-end">Aktueller Saldo</th>
        <th scope="col">Aktionen</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="a : ${accounts}">
        <td>
          <div th:text="${a.bank}"></div>
          <small th:if="${a.description}" class="text-muted" th:text="${a.description}"></small>
        </td>
        <td th:text="${a.accountNumber}"></td>
        <td th:text="${a.currency}"></td>
        <td>
          <span th:if="${a.assetAllocation != null}"
                th:class="${a.assetAllocation.name() == 'RISIKOBEHAFTET'} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                th:text="${a.assetAllocation.label}"></span>
        </td>
        <td class="text-end">
          <span th:if="${latestBalances.containsKey(a.id)}" style="white-space:nowrap"
                th:text="${#numbers.formatDecimal(latestBalances.get(a.id), 1, 'POINT', 2, 'COMMA')} + ' ' + ${a.currency}"></span>
          <span th:unless="${latestBalances.containsKey(a.id)}" class="text-muted">—</span>
        </td>
        <td>
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" aria-label="Aktionen">Aktionen</button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/accounts/{id}/edit(id=${a.id})}">Bearbeiten</a></li>
              <li><a class="dropdown-item" th:href="@{/accounts/{id}/balances(id=${a.id})}">Salden</a></li>
              <li><hr class="dropdown-divider"/></li>
              <li>
                <form th:action="@{/accounts/{id}/delete(id=${a.id})}" method="post"
                      onsubmit="return confirm('Wirklich löschen?')">
                  <button type="submit" class="dropdown-item text-danger">Löschen</button>
                </form>
              </li>
            </ul>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(accounts)}">
        <td colspan="6" class="text-center text-muted">Keine Konten vorhanden.</td>
      </tr>
    </tbody>
    <tfoot th:if="${!#lists.isEmpty(accounts)}">
      <tr class="table-secondary fw-bold">
        <td colspan="4">Gesamt</td>
        <td class="text-end" th:text="${#numbers.formatDecimal(balanceTotal, 1, 'POINT', 2, 'COMMA')} + ' EUR'"></td>
        <td></td>
      </tr>
    </tfoot>
  </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
