<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.accounts.title}">Konten</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <table class="table table-striped table-hover align-middle">
    <caption>
      <div class="d-flex justify-content-between align-items-center">
        <span th:text="#{page.accounts.title}">Konten</span>
        <a th:href="@{/accounts/new}" class="btn btn-primary btn-sm" th:text="#{common.new}">+ Neu</a>
      </div>
      <div th:if="${!#lists.isEmpty(accounts)}" class="alert alert-info d-flex justify-content-between align-items-center mb-0 mt-2 fs-6 fw-normal">
        <span th:text="#{common.total}">Gesamt</span>
        <strong th:text="${#numbers.formatDecimal(balanceTotal, 1, 'POINT', 2, 'COMMA')} + ' EUR'"></strong>
      </div>
    </caption>
    <thead class="table-dark">
      <tr>
        <th scope="col" th:text="#{col.bank}">Bank</th>
        <th scope="col" th:text="#{col.account-number}">Kontonummer</th>
        <th scope="col" th:text="#{col.currency}">Währung</th>
        <th scope="col" th:text="#{col.allocation}">Allocation</th>
        <th scope="col" class="text-end" th:text="#{col.balance}">Aktueller Saldo</th>
        <th scope="col" th:text="#{common.actions}">Aktionen</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="a : ${accounts}">
        <td>
          <div th:text="${a.bank}"></div>
          <small th:if="${a.description}" class="text-muted" th:text="${a.description}"></small>
        </td>
        <td th:text="${a.accountNumber}"></td>
        <td th:text="${a.currency}"></td>
        <td>
          <span th:if="${a.assetAllocation != null}"
                th:class="${a.assetAllocation.name() == 'RISIKOBEHAFTET'} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                th:text="${#messages.msg('assetAllocation.' + a.assetAllocation.name())}"></span>
        </td>
        <td class="text-end">
          <span th:if="${latestBalances.containsKey(a.id)}" style="white-space:nowrap"
                th:text="${#numbers.formatDecimal(latestBalances.get(a.id), 1, 'POINT', 2, 'COMMA')} + ' ' + ${a.currency}"></span>
          <span th:unless="${latestBalances.containsKey(a.id)}" class="text-muted">—</span>
        </td>
        <td>
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" th:attr="aria-label=#{common.actions}" th:text="#{common.actions}">Aktionen</button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/accounts/{id}/edit(id=${a.id})}" th:text="#{common.edit}">Bearbeiten</a></li>
              <li><a class="dropdown-item" th:href="@{/accounts/{id}/balances(id=${a.id})}" th:text="#{page.accounts.balances.title}">Salden</a></li>
              <li><hr class="dropdown-divider"/></li>
              <li>
                <form th:action="@{/accounts/{id}/delete(id=${a.id})}" method="post"
                      th:attr="onsubmit=|return confirm('#{confirm.delete}')|">
                  <button type="submit" class="dropdown-item text-danger" th:text="#{common.delete}">Löschen</button>
                </form>
              </li>
            </ul>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(accounts)}">
        <td colspan="6" class="text-center text-muted" th:text="#{page.accounts.empty}">Keine Konten vorhanden.</td>
      </tr>
    </tbody>
  </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
