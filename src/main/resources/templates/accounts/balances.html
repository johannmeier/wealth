<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.accounts.balances.title}">Salden</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <div class="row g-4 align-items-start">
    <div class="col-lg-4">
      <h3 th:text="${account.displayName}"></h3>
      <div class="card">
        <div class="card-header" th:text="#{page.accounts.balances.new}">Neuer Saldo</div>
        <div class="card-body">
          <form th:action="@{/accounts/{id}/balances/save(id=${account.id})}" method="post">
            <div class="mb-3">
              <label class="form-label" for="bal-date" th:text="#{col.date}">Datum</label>
              <input type="date" id="bal-date" name="date" class="form-control"
                     th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"/>
            </div>
            <div class="mb-3">
              <label class="form-label" for="bal-balance">
                <span th:text="#{col.balance}">Saldo</span> (<span th:text="${account.currency}"></span>)
              </label>
              <input type="number" id="bal-balance" name="balance" class="form-control" step="0.01" required/>
              <div class="form-text" th:if="${account.ownershipShare != null and account.ownershipShare.compareTo(T(java.math.BigDecimal).valueOf(100)) != 0}"
                   th:text="#{page.accounts.balances.ownership-hint(${account.ownershipShare})}">Hinweis.</div>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Speichern</button>
          </form>
        </div>
      </div>
      <a th:href="${returnUrl}" class="btn btn-outline-secondary mt-3" th:text="#{common.back}">Zurück</a>
    </div>
    <div class="col-lg-8">
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <caption th:text="#{page.accounts.balances.history}">Saldenhistorie</caption>
          <thead class="table-dark">
            <tr>
              <th scope="col" th:text="#{col.date}">Datum</th>
              <th scope="col" class="text-end" th:text="#{col.balance}">Saldo</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="b : ${balances}">
              <td th:text="${#temporals.format(b.date, 'dd.MM.yyyy')}"></td>
              <td class="text-end" th:text="${#numbers.formatDecimal(b.balance, 1, 'DEFAULT', 2, 'DEFAULT')} + ' ' + ${account.currency}"></td>
              <td>
                <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                        data-bs-target="#balance-delete-modal"
                        th:attr="onclick=|document.getElementById('balance-delete-form').action='@{/accounts/{id}/balances/{bid}/delete(id=${account.id},bid=${b.id})}';|"
                        th:text="#{common.delete}">Löschen</button>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(balances)}">
              <td colspan="3" class="text-center text-muted" th:text="#{page.accounts.balances.empty}">Noch keine Salden eingetragen.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  </div>

  <div class="modal fade" id="balance-delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" th:text="#{common.delete}">Löschen</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" th:attr="aria-label=#{common.close}"></button>
        </div>
        <div class="modal-body" th:text="#{confirm.delete-balance}">Saldo wirklich löschen?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{common.cancel}">Abbrechen</button>
          <form id="balance-delete-form" method="post">
            <button type="submit" class="btn btn-danger" th:text="#{common.delete}">Löschen</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
