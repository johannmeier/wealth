<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Salden</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <h3>Salden: <span th:text="${account.displayName}"></span></h3>

  <div class="card mb-4" style="max-width:400px">
    <div class="card-header">Neuer Saldo</div>
    <div class="card-body">
      <form th:action="@{/accounts/{id}/balances/save(id=${account.id})}" method="post">
        <div class="mb-3">
          <label class="form-label">Datum</label>
          <input type="date" name="date" class="form-control" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Saldo (<span th:text="${account.currency}"></span>)</label>
          <input type="number" name="balance" class="form-control" step="0.01" required/>
        </div>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </form>
    </div>
  </div>

  <h5>Historie</h5>
  <table class="table table-striped align-middle">
    <thead class="table-dark">
      <tr><th>Datum</th><th class="text-end">Saldo</th><th></th></tr>
    </thead>
    <tbody>
      <tr th:each="b : ${balances}">
        <td th:text="${#temporals.format(b.date, 'dd.MM.yyyy')}"></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(b.balance, 1, 'COMMA', 2, 'POINT')} + ' ' + ${account.currency}"></td>
        <td>
          <form th:action="@{/accounts/{id}/balances/{bid}/delete(id=${account.id},bid=${b.id})}" method="post" class="d-inline"
                onsubmit="return confirm('Saldo wirklich löschen?')">
            <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(balances)}">
        <td colspan="3" class="text-center text-muted">Noch keine Salden eingetragen.</td>
      </tr>
    </tbody>
  </table>
  <a th:href="@{/accounts}" class="btn btn-outline-secondary">Zurück</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
