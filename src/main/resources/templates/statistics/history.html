<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.statistics.history.title}">Vermögensverlauf</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div class="table-section">
  <h3 th:text="#{page.statistics.history.title}">Vermögensverlauf</h3>

  <div th:if="${!#lists.isEmpty(history)}">
    <div class="mb-4" style="position:relative;height:260px">
      <canvas id="wealthChart"></canvas>
    </div>


    <div class="table-responsive">
      <table class="table table-sm table-striped table-hover align-middle">
        <caption class="visually-hidden" th:text="#{page.statistics.history.title}">Vermögensverlauf</caption>
        <thead class="table-dark">
          <tr>
            <th scope="col" th:text="#{col.month}">Monat</th>
            <th scope="col" class="text-end" th:text="#{nav.assets}">Wertpapiere</th>
            <th scope="col" class="text-end" th:text="#{nav.accounts}">Konten</th>
            <th scope="col" class="text-end" th:text="#{nav.coins}">Münzen</th>
            <th scope="col" class="text-end fw-bold" th:text="#{common.total}">Gesamt</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${history}">
            <td th:text="${#temporals.format(row.month, 'MM/yyyy')}">01/2025</td>
            <td class="text-end"
                th:text="${#numbers.formatDecimal(row.assetsValue.multiply(eurToDisplayRate), 1, 'DEFAULT', 0, 'DEFAULT')}"></td>
            <td class="text-end"
                th:text="${#numbers.formatDecimal(row.accountsValue.multiply(eurToDisplayRate), 1, 'DEFAULT', 0, 'DEFAULT')}"></td>
            <td class="text-end"
                th:text="${#numbers.formatDecimal(row.coinsValue.multiply(eurToDisplayRate), 1, 'DEFAULT', 0, 'DEFAULT')}"></td>
            <td class="text-end fw-bold"
                th:text="${#numbers.formatDecimal(row.total.multiply(eurToDisplayRate), 1, 'DEFAULT', 0, 'DEFAULT')}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(history)}" class="text-muted" th:text="#{page.statistics.no-data}">Keine Daten vorhanden.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
(function () {
  var history = /*[[${history}]]*/ [];
  if (!history || history.length === 0) return;

  var eurRate = /*[[${eurToDisplayRate}]]*/ 1;
  var currency = /*[[${displayCurrency}]]*/ 'EUR';

  var labels = [];
  var totals = [];
  var assets = [];
  var accounts = [];
  var coins = [];

  for (var i = history.length - 1; i >= 0; i--) {
    var row = history[i];
    var m = row.month; // "YYYY-MM-DD"
    labels.push(m.substring(5, 7) + '/' + m.substring(0, 4));
    totals.push(Math.round(parseFloat(row.total) * eurRate));
    assets.push(Math.round(parseFloat(row.assetsValue) * eurRate));
    accounts.push(Math.round(parseFloat(row.accountsValue) * eurRate));
    coins.push(Math.round(parseFloat(row.coinsValue) * eurRate));
  }

  var isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
  var gridColor = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';

  new Chart(document.getElementById('wealthChart'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: /*[[#{common.total}]]*/ 'Gesamt',
          data: totals,
          borderColor: 'rgb(13,110,253)',
          backgroundColor: 'rgba(13,110,253,0.15)',
          fill: true,
          tension: 0.1,
          pointRadius: labels.length > 24 ? 0 : 3
        },
        {
          label: /*[[#{nav.assets}]]*/ 'Wertpapiere',
          data: assets,
          borderColor: 'rgb(25,135,84)',
          backgroundColor: 'transparent',
          tension: 0.1,
          pointRadius: labels.length > 24 ? 0 : 2
        },
        {
          label: /*[[#{nav.accounts}]]*/ 'Konten',
          data: accounts,
          borderColor: 'rgb(255,193,7)',
          backgroundColor: 'transparent',
          tension: 0.1,
          pointRadius: labels.length > 24 ? 0 : 2
        },
        {
          label: /*[[#{nav.coins}]]*/ 'Münzen',
          data: coins,
          borderColor: 'rgb(176,134,60)',
          backgroundColor: 'transparent',
          tension: 0.1,
          pointRadius: labels.length > 24 ? 0 : 2
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12 } },
        tooltip: {
          callbacks: {
            label: function (ctx) {
              return ctx.dataset.label + ': ' + ctx.raw.toLocaleString() + ' ' + currency;
            }
          }
        }
      },
      scales: {
        x: { grid: { color: gridColor } },
        y: {
          grid: { color: gridColor },
          ticks: {
            callback: function (v) { return v.toLocaleString() + ' ' + currency; }
          }
        }
      }
    }
  });
})();
/*]]>*/
</script>
</body>
</html>
