<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.statistics.overview.title}">Statistik – Übersicht</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div class="table-section">
  <h3 th:text="#{page.statistics.overview.title}">Übersicht</h3>
  <div class="alert alert-info d-flex justify-content-between align-items-center">
    <span th:text="#{page.statistics.total-wealth}">Gesamtvermögen</span>
    <strong th:text="${#numbers.formatDecimal(totalWealth.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')} + ' ' + ${displayCurrency}"></strong>
  </div>

  <table class="table table-sm table-striped table-hover align-middle">
    <caption class="visually-hidden">Positionen nach Risikoklasse</caption>
    <thead class="table-dark">
      <tr>
        <th scope="col" th:text="#{col.name}">Name</th>
        <th scope="col" th:text="#{col.type}">Art</th>
        <th scope="col" th:text="#{col.index}">Index</th>
        <th scope="col" th:text="#{col.depot}">Depot</th>
        <th scope="col" class="text-end" th:text="#{col.value}">Wert (€)</th>
        <th scope="col" class="text-end" style="white-space:nowrap" th:text="#{col.percentage}">Anteil %</th>
      </tr>
    </thead>
    <tbody>
      <th:block th:each="group : ${groups}">
        <tr class="table-secondary">
          <td colspan="4" class="fw-semibold">
            <span th:class="${group.name == 'RISIKOBEHAFTET'} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                  th:text="${#messages.msg('assetAllocation.' + group.name)}"></span>
          </td>
          <td class="text-end fw-semibold"
              th:text="${#numbers.formatDecimal(group.totalValue.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')}"></td>
          <td class="text-end fw-semibold" style="white-space:nowrap"
              th:text="${#numbers.formatDecimal(group.percentage, 1, 'DEFAULT', 2, 'DEFAULT')} + ' %'"></td>
        </tr>
        <tr th:each="p : ${group.positions}">
          <td th:text="${p.name}"></td>
          <td>
            <span th:if="${p.type == 'ACCOUNT'}" class="badge bg-info text-dark" th:text="#{assetType.KONTO}">Konto</span>
            <span th:if="${p.type == 'COIN'}" class="badge" style="background-color:#b8860b" th:text="#{assetType.EDELMETALL}">Edelmetall</span>
            <span th:if="${p.assetType != null}" class="badge bg-primary" th:text="${#messages.msg('assetType.' + p.assetType.name())}"></span>
          </td>
          <td th:text="${p.indexName ?: '-'}"></td>
          <td th:text="${p.depotName ?: '-'}"></td>
          <td class="text-end" th:text="${#numbers.formatDecimal(p.value.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')}"></td>
          <td class="text-end text-muted" style="white-space:nowrap" th:text="${#numbers.formatDecimal(p.percentage, 1, 'DEFAULT', 2, 'DEFAULT')} + ' %'"></td>
        </tr>
      </th:block>
    </tbody>
  </table>

  <div th:if="${#lists.isEmpty(groups)}" class="text-muted" th:text="#{page.statistics.no-positions}">Keine Positionen vorhanden.</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
