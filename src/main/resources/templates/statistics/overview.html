<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Statistik – Übersicht</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
  <h3>Übersicht aller Positionen</h3>
  <div class="alert alert-info">
    Gesamtvermögen: <strong th:text="${#numbers.formatDecimal(totalWealth, 1, 'COMMA', 2, 'POINT')} + ' €'"></strong>
  </div>

  <table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
      <tr><th>Name</th><th>Art</th><th>Allocation</th><th>Index</th><th>Depot</th>
          <th class="text-end">Wert (€)</th><th class="text-end">Anteil %</th></tr>
    </thead>
    <tbody>
      <tr th:each="p : ${positions}">
        <td th:text="${p.name}"></td>
        <td>
          <span th:if="${p.type == 'ACCOUNT'}" class="badge bg-info">Konto</span>
          <span th:if="${p.assetType != null}" class="badge bg-primary" th:text="${p.assetType.label}"></span>
        </td>
        <td>
          <span th:if="${p.assetAllocation != null}"
                th:class="${p.assetAllocation.name() == 'RISIKOBEHAFTET'} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                th:text="${p.assetAllocation.label}"></span>
        </td>
        <td th:text="${p.indexName ?: '-'}"></td>
        <td th:text="${p.depotName ?: '-'}"></td>
        <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(p.value, 1, 'COMMA', 2, 'POINT')}"></td>
        <td class="text-end" th:text="${p.percentage} + ' %'"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(positions)}">
        <td colspan="7" class="text-center text-muted">Keine Positionen vorhanden.</td>
      </tr>
    </tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
