<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Statistik – Übersicht</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div class="table-section">
  <h3>Übersicht</h3>
  <div class="alert alert-info d-flex justify-content-between align-items-center">
    <span>Gesamtvermögen</span>
    <strong th:text="${#numbers.formatDecimal(totalWealth, 1, 'COMMA', 2, 'POINT')} + ' €'"></strong>
  </div>

  <table class="table table-sm table-striped table-hover align-middle">
    <caption class="visually-hidden">Positionen nach Risikoklasse</caption>
    <thead class="table-dark">
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Art</th>
        <th scope="col">Index</th>
        <th scope="col">Depot</th>
        <th scope="col" class="text-end">Wert (€)</th>
        <th scope="col" class="text-end" style="white-space:nowrap">Anteil %</th>
      </tr>
    </thead>
    <tbody>
      <th:block th:each="group : ${groups}">
        <tr class="table-secondary">
          <td colspan="4" class="fw-semibold">
            <span th:class="${group.name == 'Risikobehaftet'} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                  th:text="${group.name}"></span>
          </td>
          <td class="text-end fw-semibold"
              th:text="${#numbers.formatDecimal(group.totalValue, 1, 'COMMA', 2, 'POINT')}"></td>
          <td class="text-end fw-semibold" style="white-space:nowrap"
              th:text="${group.percentage} + ' %'"></td>
        </tr>
        <tr th:each="p : ${group.positions}">
          <td th:text="${p.name}"></td>
          <td>
            <span th:if="${p.type == 'ACCOUNT'}" class="badge bg-info text-dark">Konto</span>
            <span th:if="${p.type == 'COIN'}" class="badge" style="background-color:#b8860b">Edelmetall</span>
            <span th:if="${p.assetType != null}" class="badge bg-primary" th:text="${p.assetType.label}"></span>
          </td>
          <td th:text="${p.indexName ?: '-'}"></td>
          <td th:text="${p.depotName ?: '-'}"></td>
          <td class="text-end" th:text="${#numbers.formatDecimal(p.value, 1, 'COMMA', 2, 'POINT')}"></td>
          <td class="text-end text-muted" style="white-space:nowrap" th:text="${p.percentage} + ' %'"></td>
        </tr>
      </th:block>
    </tbody>
  </table>

  <div th:if="${#lists.isEmpty(groups)}" class="text-muted">Keine Positionen vorhanden.</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
