<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Statistik – Asset Allocation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div class="table-section">
  <h3>Auflistung nach Asset Allocation</h3>
  <div class="alert alert-info d-flex justify-content-between align-items-center">
    <span>Gesamtvermögen</span>
    <strong th:text="${#numbers.formatDecimal(totalWealth, 1, 'COMMA', 2, 'POINT')} + ' €'"></strong>
  </div>

  <table class="table table-sm table-striped align-middle">
    <thead class="table-dark">
      <tr>
        <th>Name</th>
        <th>Art</th>
        <th>Index</th>
        <th class="text-end">Wert (€)</th>
        <th class="text-end">Anteil %</th>
      </tr>
    </thead>
    <tbody>
      <th:block th:each="group : ${groups}">
        <tr class="table-secondary">
          <td colspan="3" class="fw-semibold">
            <span th:class="${group.name == 'Risikobehaftet'} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                  th:text="${group.name}"></span>
          </td>
          <td class="text-end fw-semibold"
              th:text="${#numbers.formatDecimal(group.totalValue, 1, 'COMMA', 2, 'POINT')}"></td>
          <td class="text-end fw-semibold"
              th:text="${group.percentage} + ' %'"></td>
        </tr>
        <tr th:each="p : ${group.positions}">
          <td th:text="${p.name}"></td>
          <td th:text="${p.assetType?.label ?: (p.type == 'ACCOUNT' ? 'Konto' : '-')}"></td>
          <td th:text="${p.indexName ?: '-'}"></td>
          <td class="text-end" th:text="${#numbers.formatDecimal(p.value, 1, 'COMMA', 2, 'POINT')}"></td>
          <td class="text-end" th:text="${p.percentage} + ' %'"></td>
        </tr>
      </th:block>
    </tbody>
  </table>

  <div th:if="${#lists.isEmpty(groups)}" class="text-muted">Keine Daten vorhanden.</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
