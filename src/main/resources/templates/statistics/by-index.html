<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.statistics.by-index.title}">Statistik – Nach Index</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div class="table-section">
  <h3 th:text="#{page.statistics.by-index.title}">Auflistung nach Index</h3>
  <div class="alert alert-info d-flex justify-content-between align-items-center">
    <span th:text="#{page.statistics.total-wealth}">Gesamtvermögen</span>
    <strong th:text="${#numbers.formatDecimal(totalWealth.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')} + ' ' + ${displayCurrency}"></strong>
  </div>

  <table class="table table-hover align-middle">
    <caption class="visually-hidden" th:text="#{page.statistics.by-index.title}">Auflistung nach Index</caption>
    <thead class="table-dark">
      <tr>
        <th scope="col" th:text="#{col.index}">Index</th>
        <th scope="col" class="text-end" th:text="#{col.value}">Wert (€)</th>
        <th scope="col" class="text-end" style="white-space:nowrap" th:text="#{col.percentage}">Anteil %</th>
        <th scope="col"></th>
      </tr>
    </thead>
    <tbody>
      <th:block th:each="group, i : ${groups}">
        <!-- Zusammenfassungszeile -->
        <tr class="fw-semibold" th:classappend="${i.odd} ? 'table-light' : ''">
          <td th:text="${#messages.msgOrNull('stats.' + group.name) ?: group.name}"></td>
          <td class="text-end" th:text="${#numbers.formatDecimal(group.totalValue.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')}"></td>
          <td class="text-end" style="white-space:nowrap" th:text="${#numbers.formatDecimal(group.percentage, 1, 'DEFAULT', 2, 'DEFAULT')} + ' %'"></td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary toggle-group"
                    th:attr="data-target='group-' + ${i.index}">
              <span th:text="${#lists.size(group.positions)}"></span> ▶
            </button>
          </td>
        </tr>
        <!-- Detail-Zeilen -->
        <tr th:each="p : ${group.positions}"
            th:id="'group-' + ${i.index}"
            class="group-detail d-none table-light">
          <td class="ps-4" th:text="${p.name}"></td>
          <td class="text-end" th:text="${#numbers.formatDecimal(p.value.multiply(eurToDisplayRate), 1, 'DEFAULT', 2, 'DEFAULT')}"></td>
          <td class="text-end text-muted" style="white-space:nowrap" th:text="${#numbers.formatDecimal(p.percentage, 1, 'DEFAULT', 2, 'DEFAULT')} + ' %'"></td>
          <td class="text-muted small" th:text="${p.depotName ?: '-'}"></td>
        </tr>
      </th:block>
    </tbody>
  </table>

  <div th:if="${#lists.isEmpty(groups)}" class="text-muted" th:text="#{page.statistics.no-data}">Keine Daten vorhanden.</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('.toggle-group').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var target = this.dataset.target;
    var rows = document.querySelectorAll('[id="' + target + '"]');
    var expand = rows.length > 0 && rows[0].classList.contains('d-none');
    rows.forEach(function (r) { r.classList.toggle('d-none', !expand); });
    var count = rows.length;
    this.innerHTML = count + (expand ? ' ▼' : ' ▶');
  });
});
</script>
</body>
</html>
