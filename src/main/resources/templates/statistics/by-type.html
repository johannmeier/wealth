<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Statistik – Nach Wertpapierart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
  <h3>Auflistung nach Wertpapierart</h3>
  <div class="alert alert-info">
    Gesamtvermögen: <strong th:text="${#numbers.formatDecimal(totalWealth, 1, 'COMMA', 2, 'POINT')} + ' €'"></strong>
  </div>
  <div th:each="group : ${groups}" class="mb-4">
    <div class="d-flex justify-content-between align-items-center">
      <h5 th:text="${group.name}"></h5>
      <span class="badge bg-secondary fs-6"
            th:text="${#numbers.formatDecimal(group.totalValue, 1, 'COMMA', 2, 'POINT')} + ' € (' + ${group.percentage} + ' %)'"></span>
    </div>
    <table class="table table-sm table-striped">
      <thead class="table-dark">
        <tr><th>Name</th><th>Depot</th><th>Index</th><th class="text-end">Wert (€)</th><th class="text-end">Anteil %</th></tr>
      </thead>
      <tbody>
        <tr th:each="p : ${group.positions}">
          <td th:text="${p.name}"></td>
          <td th:text="${p.depotName ?: '-'}"></td>
          <td th:text="${p.indexName ?: '-'}"></td>
          <td class="text-end" th:text="${#numbers.formatDecimal(p.value, 1, 'COMMA', 2, 'POINT')}"></td>
          <td class="text-end" th:text="${p.percentage} + ' %'"></td>
        </tr>
      </tbody>
    </table>
  </div>
  <div th:if="${#lists.isEmpty(groups)}" class="text-muted">Keine Daten vorhanden.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
