<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title>Statistik – Nach Wertpapierart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div class="table-section">
  <h3>Auflistung nach Wertpapierart</h3>
  <div class="alert alert-info d-flex justify-content-between align-items-center">
    <span>Gesamtvermögen</span>
    <strong th:text="${#numbers.formatDecimal(totalWealth, 1, 'COMMA', 2, 'POINT')} + ' €'"></strong>
  </div>

  <table class="table table-striped table-hover align-middle">
    <caption class="visually-hidden">Auflistung nach Wertpapierart</caption>
    <thead class="table-dark">
      <tr>
        <th scope="col">Art</th>
        <th scope="col" class="text-end">Wert (€)</th>
        <th scope="col" class="text-end" style="white-space:nowrap">Anteil %</th>
        <th scope="col"></th>
      </tr>
    </thead>
    <tbody>
      <th:block th:each="group, i : ${groups}">
        <tr class="fw-semibold">
          <td th:text="${group.name}"></td>
          <td class="text-end" th:text="${#numbers.formatDecimal(group.totalValue, 1, 'COMMA', 2, 'POINT')}"></td>
          <td class="text-end" style="white-space:nowrap" th:text="${group.percentage} + ' %'"></td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary toggle-group"
                    th:attr="data-target='group-' + ${i.index}">
              <span th:text="${#lists.size(group.positions)}"></span> ▶
            </button>
          </td>
        </tr>
        <tr th:each="p : ${group.positions}"
            th:id="'group-' + ${i.index}"
            class="group-detail d-none table-light">
          <td class="ps-4" th:text="${p.name}"></td>
          <td class="text-end" th:text="${#numbers.formatDecimal(p.value, 1, 'COMMA', 2, 'POINT')}"></td>
          <td class="text-end text-muted" style="white-space:nowrap" th:text="${p.percentage} + ' %'"></td>
          <td class="text-muted small" th:text="${p.depotName ?: '-'}"></td>
        </tr>
      </th:block>
    </tbody>
  </table>

  <div th:if="${#lists.isEmpty(groups)}" class="text-muted">Keine Daten vorhanden.</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('.toggle-group').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var target = this.dataset.target;
    var rows = document.querySelectorAll('[id="' + target + '"]');
    var expand = rows.length > 0 && rows[0].classList.contains('d-none');
    rows.forEach(function (r) { r.classList.toggle('d-none', !expand); });
    this.innerHTML = rows.length + (expand ? ' ▼' : ' ▶');
  });
});
</script>
</body>
</html>
