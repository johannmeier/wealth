<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="navbar">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">💰 Vermögen</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/assets}">Wertpapiere</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/accounts}">Konten</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/depots}">Depots</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/coins}">Münzen</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/standing-orders}">Daueraufträge</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Statistiken</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/statistics/overview}">Übersicht</a></li>
            <li><a class="dropdown-item" th:href="@{/statistics/by-index}">Nach Index</a></li>
            <li><a class="dropdown-item" th:href="@{/statistics/by-type}">Nach Wertpapierart</a></li>
            <li><a class="dropdown-item" th:href="@{/statistics/by-allocation}">Nach Allocation</a></li>
          </ul>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/info}">Info</a></li>
      </ul>
    </div>
  </div>
</nav>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('input[type="number"]').forEach(function (el) {
    el.addEventListener('paste', function (e) {
      var raw = (e.clipboardData || window.clipboardData).getData('text').trim();
      // Deutsches Format mit Tausenderpunkt: "2.977,15" → "2977,15", "1.234.567" → "1234567"
      if (/^\d{1,3}(\.\d{3})+(,\d*)?$/.test(raw)) {
        e.preventDefault();
        el.value = raw.replace(/\./g, '').replace(',', '.');
      }
    });
  });
});
</script>
</th:block>
</body>
</html>
