<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <title th:text="#{page.banks.title}">Banken</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container-fluid px-4 mt-4">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" th:attr="aria-label=#{common.close}" data-bs-dismiss="alert"></button>
  </div>
  <div class="table-section">
  <table class="table table-striped table-hover align-middle">
    <caption>
      <div class="d-flex justify-content-between align-items-center">
        <span th:text="#{page.banks.title}">Banken</span>
        <a th:href="@{/banks/new}" class="btn btn-primary btn-sm" th:text="#{common.new}">+ Neu</a>
      </div>
    </caption>
    <thead class="table-dark">
      <tr>
        <th scope="col" th:text="#{col.name}">Name</th>
        <th scope="col" th:text="#{common.actions}">Aktionen</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="b : ${banks}">
        <td th:text="${b.name}"></td>
        <td>
          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" th:attr="aria-label=#{common.actions}" th:text="#{common.actions}">Aktionen</button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/banks/{id}(id=${b.id})}" th:text="#{page.banks.detail}">Konten &amp; Depots</a></li>
              <li><a class="dropdown-item" th:href="@{/banks/{id}/edit(id=${b.id})}" th:text="#{common.edit}">Bearbeiten</a></li>
              <li><hr class="dropdown-divider"/></li>
              <li>
                <form th:action="@{/banks/{id}/delete(id=${b.id})}" method="post"
                      th:attr="onsubmit=|return confirm('#{confirm.delete}')|">
                  <button type="submit" class="dropdown-item text-danger" th:text="#{common.delete}">Löschen</button>
                </form>
              </li>
            </ul>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(banks)}">
        <td colspan="2" class="text-center text-muted" th:text="#{page.banks.empty}">Keine Banken vorhanden.</td>
      </tr>
    </tbody>
  </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
